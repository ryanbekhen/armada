version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps # "Dependencies" in the release notes
    labels: [dependencies]
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci # CI only; left out of the release notes
      include: scope
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
