version: 2
updates:
  # The Cargo workspace (Cargo.lock at the root). prost, tonic, and pbjson
  # are pinned exactly, in step with the generators of proto/gen: when they
  # move, `make proto-rust` writes armada-proto's code again.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps # "Dependencies" in the release notes
    labels: [dependencies]
    groups:
      rust-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci # CI only; left out of the release notes
      include: scope
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
