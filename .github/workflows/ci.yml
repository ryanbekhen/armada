name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs; Dependabot keeps the pins current.
jobs:
  # Release notes are grouped by commit type (docs/releasing.md), so every
  # commit of a pull request needs a Conventional Commits subject.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-commits.sh "$BASE..$HEAD"

  # Pull requests and pushes that touch only documents skip the jobs below
  # that build and test code (docs/README.md, CONTRIBUTING.md). Skipped jobs
  # count as passed for the required checks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Documents: Markdown anywhere, docs/ (its generated CLI reference
          # included), the license, and issue templates. Anything else is code.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] ||
            ! files=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          for f in $files; do
            case "$f" in
            *.md | docs/* | LICENSE | .github/ISSUE_TEMPLATE/*) ;;
            *) code=true ;;
            esac
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed files: $(echo "$files" | wc -l); code: $code"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall # build with the go.mod toolchain

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  # Validates the rendered HAProxy configuration with the pinned image.
  haproxy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -tags integration -run Integration -v ./internal/proxy/haproxy/

  vuln:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The module proxy sometimes drops a download; retry fetching, never
      # the check itself, so a finding still fails the job.
      - name: Download modules and tools
        run: |
          for i in 1 2 3; do
            go mod download && go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 && go install github.com/google/go-licenses/v2@v2.0.1 && exit 0
            echo "download failed (attempt $i), retrying"
            sleep 15
          done
          exit 1
      - run: "\"$(go env GOPATH)/bin/govulncheck\" ./..."
      # Every Go module must be under a license that allows commercial use
      # (THIRD_PARTY_NOTICES.md).
      - run: make licenses

  # The condition is on the steps, not the job: a skipped matrix job reports
  # one check named "build", never the "build (linux, amd64)" and
  # "build (linux, arm64)" the ruleset requires, so documents-only pull
  # requests could not merge.
  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - if: needs.changes.outputs.code == 'true'
        run: make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      # The armada client also builds for macOS (ADR 0027).
      - if: needs.changes.outputs.code == 'true'
        run: go build -trimpath -o /dev/null ./cmd/armada
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}

  # armada-log (logger/), armada-shim (shim/), and armada-dns (dns/): the
  # Rust programs release builds embed. Lint, unit tests, static builds for
  # both architectures, the comparison of armada-log with the Go writer it
  # must match byte for byte, armada-dns against the Go resolver's tests,
  # and armada-node (ADR 0054): its crates' licenses, and HAProxy
  # configurations it must render as the Go renderer does.
  logger:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # rustup is on the runner; the toolchain comes from rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: logger
      - run: cargo fmt --check
        working-directory: logger
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: logger
      - run: cargo test --locked
        working-directory: logger
      - run: rustup toolchain install
        working-directory: shim
      - run: cargo fmt --check
        working-directory: shim
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: shim
      - run: cargo test --locked
        working-directory: shim
      - run: rustup toolchain install
        working-directory: dns
      - run: cargo fmt --check
        working-directory: dns
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: dns
      - run: cargo test --locked
        working-directory: dns
      - run: rustup toolchain install
        working-directory: node
      - run: cargo fmt --check
        working-directory: node
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: node
      - run: cargo test --locked
        working-directory: node
      - run: cargo install cargo-deny --locked --version 0.22.0
      - run: cargo deny --locked check licenses
        working-directory: node
      - run: make logger
      - run: make shim
      - run: make dns
      - run: make node
      - run: go test -race -run 'TestArmadaLog|TestLoggerStandardLibraryOnly' -v ./internal/runtime/embedded/
        env:
          ARMADA_LOG_BIN: ${{ github.workspace }}/logger/target/x86_64-unknown-linux-musl/release/armada-log
      # armada-dns answers what the Go resolver's tests ask (ADR 0053).
      - run: go test -race -run 'TestProcess|TestStartProcess' -v ./internal/dnsserver/
        env:
          ARMADA_DNS_BIN: ${{ github.workspace }}/dns/target/x86_64-unknown-linux-musl/release/armada-dns
      - run: go test -race -run 'TestArmadaNode|TestRenderFallsBack' -v ./internal/proxy/haproxy/ ./internal/clusternet/ ./internal/runtime/ ./internal/runtime/containerd/
        env:
          ARMADA_NODE_BIN: ${{ github.workspace }}/node/target/x86_64-unknown-linux-musl/release/armada-node
      # Volume archives, backups, and pulls set armada-node's test hooks
      # or pass --extra-ca, which only a test build has (node/src/hooks.rs);
      # the release build above ignores the hooks and refuses --extra-ca.
      - run: cargo clippy --locked --all-targets --features test-hooks -- -D warnings
        working-directory: node
      - run: make node-test-hooks
      - run: go test -race -run 'TestArmadaNodeVolume|TestArmadaNodeSnapshot|TestArmadaNodeIgnoresTestHooks|TestArmadaNodePull|TestArmadaNodeProxy|TestArmadaNodeConvert' -v ./internal/agent/ ./internal/runtime/containerd/
        env:
          ARMADA_NODE_BIN: ${{ github.workspace }}/node/target/test-hooks/x86_64-unknown-linux-musl/release/armada-node

  installer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh scripts/*.sh test/e2e/*.sh test/bench/*.sh
      - run: sh test/install_test.sh

  release-config:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
