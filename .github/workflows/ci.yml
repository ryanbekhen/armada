name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs only what a change touches (scripts/ci-changes.sh, job
# changes): the workspace's members that changed and every member that
# depends on one, the programs outside the workspace that changed, and the
# packaging when something a release builds changed. A pull request that
# touches only documents runs nothing heavy.
#
# The repository's ruleset requires lint, test, vuln, build (linux, amd64),
# build (linux, arm64), haproxy, installer, release-config, commits, and
# logger. A job skipped by its `if` counts as passed, so each of them is
# kept, and skips what a change does not need.
#
# Actions are pinned to full commit SHAs; Dependabot keeps the pins current.
env:
  CARGO_TERM_COLOR: never
  # Incremental compilation saves little on CI and writes gigabytes.
  CARGO_INCREMENTAL: 0

jobs:
  # Release notes are grouped by commit type (docs/releasing.md), so every
  # commit of a pull request needs a Conventional Commits subject.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-commits.sh "$BASE..$HEAD"

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      crates: ${{ steps.diff.outputs.crates }}
      packages: ${{ steps.diff.outputs.packages }}
      features: ${{ steps.diff.outputs.features }}
      replays: ${{ steps.diff.outputs.replays }}
      logger: ${{ steps.diff.outputs.logger }}
      shim: ${{ steps.diff.outputs.shim }}
      dns: ${{ steps.diff.outputs.dns }}
      proto_gen: ${{ steps.diff.outputs.proto_gen }}
      clidoc: ${{ steps.diff.outputs.clidoc }}
      haproxy: ${{ steps.diff.outputs.haproxy }}
      installer: ${{ steps.diff.outputs.installer }}
      release: ${{ steps.diff.outputs.release }}
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          sh scripts/ci-changes.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  # Formats and lints of the members a change touches, as released and
  # with the test features (the hooks and parity programs), and of the
  # programs outside the workspace that changed.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      PACKAGES: ${{ needs.changes.outputs.packages }}
      FEATURES: ${{ needs.changes.outputs.features }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Crates and build output kept between runs on GitHub's runners
      # (keyed by the lock and the toolchain), so a run builds only what
      # changed.
      - &cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
            target
          key: rust-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ github.job }}-
      # rustup is on the runner; the toolchain comes from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - if: env.PACKAGES != ''
        run: cargo clippy --locked $PACKAGES --all-targets -- -D warnings
      - if: env.PACKAGES != '' && env.FEATURES != ''
        run: cargo clippy --locked $PACKAGES --all-targets --features "$FEATURES" -- -D warnings
      # The generator of `make proto`, outside the workspace (its own lock).
      - if: needs.changes.outputs.proto_gen == 'true'
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings
        working-directory: proto/gen

  # The tests of the members a change touches (with the command line
  # reference in docs/cli, which the client's and the daemon's clidoc tests
  # compare), then their replays of what Go's code did (make replays, ADR
  # 0055 item 20): the store's, the control plane's, and the daemon's on the
  # pinned etcd, the agent's, and the client's.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      PACKAGES: ${{ needs.changes.outputs.packages }}
      REPLAYS: ${{ needs.changes.outputs.replays }}
    steps:
      - *checkout
      - *cache
      - run: rustup toolchain install
      - if: env.PACKAGES != ''
        run: cargo test --locked $PACKAGES
      - if: env.REPLAYS != ''
        run: make replays REPLAYS="$REPLAYS"
      - if: needs.changes.outputs.clidoc == 'true' && !contains(needs.changes.outputs.crates, 'client')
        run: cargo test --locked -p armada-client -p armada-daemon --test clidoc

  # The crates' licenses (deny.toml) and RustSec's advisories for every
  # crate in Cargo.lock, on every change of code: an advisory can appear
  # without one.
  vuln:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *cache
      - run: rustup toolchain install
      # The cache or the runner may hold cargo-deny already; install it
      # only when the pinned version is missing.
      - run: |
          cargo deny --version 2>/dev/null | grep -qx 'cargo-deny 0.22.0' ||
            cargo install cargo-deny --locked --force --version 0.22.0
      - run: cargo deny --locked check advisories licenses

  # The release builds of the members a change touches, static for each
  # target. arm64 builds on pushes to main only; on a pull request its job
  # reports with nothing to do. The condition is on the steps, not the job:
  # a skipped matrix job reports one check named "build", never the
  # "build (linux, amd64)" and "build (linux, arm64)" the ruleset requires.
  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    env:
      CARGO_BUILD_JOBS: 4
      PACKAGES: ${{ needs.changes.outputs.packages }}
      RUN: ${{ needs.changes.outputs.packages != '' && (matrix.goarch == 'amd64' || github.event_name == 'push') }}
      TARGET: ${{ matrix.goarch == 'arm64' && 'aarch64' || 'x86_64' }}-unknown-linux-musl
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-build-${{ matrix.goarch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-build-${{ matrix.goarch }}-
      - if: env.RUN == 'true'
        run: rustup toolchain install
      - if: env.RUN == 'true'
        run: cargo build --release --locked $PACKAGES --target "$TARGET"

  # Checks the rendered HAProxy configurations with the pinned image
  # (haproxy -c through docker, which GitHub's runners have), when the
  # renderer, its recorded cases, or the image change.
  haproxy:
    needs: changes
    if: needs.changes.outputs.haproxy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-haproxy-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-haproxy-
      - run: rustup toolchain install
      - run: make haproxy-check

  # The macOS client (ADR 0055), as the release builds it.
  client-macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true' || (github.event_name == 'push' && needs.changes.outputs.release == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/darwin-client.yml

  # armada-log (logger/), armada-shim (shim/), and armada-dns (dns/): the
  # programs the runtime pack carries, each with its own lock and toolchain
  # (standard library only). For each that changed: format, lints, tests,
  # and static builds for both architectures; for armada-log also the
  # recorded logger cases (it stores what Go's writer stored).
  logger:
    needs: changes
    if: needs.changes.outputs.logger == 'true' || needs.changes.outputs.shim == 'true' || needs.changes.outputs.dns == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      PROGRAMS: >-
        ${{ needs.changes.outputs.logger == 'true' && 'logger' || '' }}
        ${{ needs.changes.outputs.shim == 'true' && 'shim' || '' }}
        ${{ needs.changes.outputs.dns == 'true' && 'dns' || '' }}
    steps:
      - *checkout
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            logger/target
            shim/target
            dns/target
          key: rust-logger-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '*/Cargo.lock') }}
          restore-keys: rust-logger-
      - run: |
          for p in $PROGRAMS; do
            (cd "$p" && rustup toolchain install && cargo fmt --check &&
              cargo clippy --locked --all-targets -- -D warnings && cargo test --locked) || exit 1
            make "$p"
          done
      - if: needs.changes.outputs.logger == 'true'
        run: rustup toolchain install
      - if: needs.changes.outputs.logger == 'true'
        run: cargo test --locked -p armada-daemon --features test-hooks --test logwriter
        env:
          ARMADA_LOG_BIN: ${{ github.workspace }}/logger/target/x86_64-unknown-linux-musl/release/armada-log

  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh scripts/*.sh test/*.sh test/e2e/*.sh test/bench/*.sh
      - run: sh test/install_test.sh

  release-config:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check

  # The release's packaging end to end without publishing or signing, on
  # pushes to main that touch something a release builds (a pull request
  # runs release-config's check only): the runtime pack, armadad and armada
  # for both architectures, the macOS client from client-macos, the
  # archives with their files, the checksums, and the SBOMs. Then what
  # installers and upgraders read: the archive names and their binaries and
  # units, and the version string.
  release-dry-run:
    needs: [changes, client-macos]
    if: github.event_name == 'push' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          for d in logger shim dns .; do (cd "$d" && rustup toolchain install); done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: armada-darwin
          path: target
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign
      - run: sh scripts/release-contents.sh dist
