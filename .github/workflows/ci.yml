name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs; Dependabot keeps the pins current.
jobs:
  # Release notes are grouped by commit type (docs/releasing.md), so every
  # commit of a pull request needs a Conventional Commits subject.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-commits.sh "$BASE..$HEAD"

  # Pull requests and pushes that touch only documents skip the jobs below
  # that build and test code (docs/README.md, CONTRIBUTING.md). Skipped jobs
  # count as passed for the required checks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Documents: Markdown anywhere, docs/ (its generated CLI reference
          # included), the license, and issue templates. Anything else is code.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] ||
            ! files=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          for f in $files; do
            case "$f" in
            *.md | docs/* | LICENSE | .github/ISSUE_TEMPLATE/*) ;;
            *) code=true ;;
            esac
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed files: $(echo "$files" | wc -l); code: $code"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall # build with the go.mod toolchain

  # Go stays the reference while the code moves to Rust (ADR 0055): every
  # package and test still compiles and passes vet, and the Rust crates
  # are checked against Go's code by the parity tests below. Go's own unit
  # tests are not run here any more.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Crates, cargo-deny, and build output kept between runs (keyed by
      # the lock and the toolchain), so a run builds only what changed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
            target
            logger/target
            shim/target
            dns/target
          key: rust-test-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '*/Cargo.lock') }}
          restore-keys: rust-test-
      - run: go vet ./...
      - run: go test -run '^$' ./...
      - run: rustup toolchain install
      # Volume archives, backups, and pulls set armada-node's test hooks
      # or pass --extra-ca, which only a test build has (node/src/hooks.rs);
      # release builds (job logger) ignore the hooks and refuse --extra-ca.
      - run: cargo clippy --locked -p armada-node --all-targets --features test-hooks -- -D warnings
      - run: make node-test-hooks
      - run: go test -race -run 'TestArmadaNodeVolume|TestArmadaNodeSnapshot|TestArmadaNodeIgnoresTestHooks|TestArmadaNodePull|TestArmadaNodeProxy|TestArmadaNodeConvert' -v ./internal/agent/ ./internal/runtime/containerd/
        env:
          ARMADA_NODE_BIN: ${{ github.workspace }}/target/test-hooks/x86_64-unknown-linux-musl/release/armada-node
      # The CA, certificates, and secrets in Rust (ADR 0055) issue, sign,
      # seal, open, and refuse what Go's code does, each accepting what the
      # other wrote; their test programs are built only for this.
      - run: cargo clippy --locked -p armada-pki -p armada-secrets --all-targets --features armada-pki/parity,armada-secrets/parity -- -D warnings
      - run: make pki-parity
      - run: go test -race -run 'TestArmadaPKI|TestArmadaSecrets' -v ./internal/pki/ ./internal/secrets/
        env:
          ARMADA_PKI_BIN: ${{ github.workspace }}/target/debug/armada-pki-parity
          ARMADA_SECRETS_BIN: ${{ github.workspace }}/target/debug/armada-secrets-parity
      # The store in Rust (ADR 0055) runs the same operations as Go's on one
      # etcd member (the package's own, in process): the same answers and
      # keyspaces, each side's records read back by the other, concurrent
      # writers, fencing, and one election; its test program is built only
      # for this.
      - run: cargo clippy --locked -p armada-store --all-targets --features parity -- -D warnings
      - run: make store-parity
      - run: go test -race -run 'TestArmadaStore' -v ./internal/store/
        env:
          ARMADA_STORE_BIN: ${{ github.workspace }}/target/debug/armada-store-parity
      # The control plane's core in Rust (ADR 0055) is driven through the
      # same scenarios as Go's server (the package's etcd member, a test
      # clock, fake agents): the same answers, assignments, events, and
      # keyspaces after every step; its test program is built only for
      # this.
      - run: cargo clippy --locked -p armada-server --all-targets --features parity -- -D warnings
      - run: make server-parity
      - run: go test -race -run 'TestParity|TestArmadaServer' -v ./internal/server/
        env:
          ARMADA_SERVER_BIN: ${{ github.workspace }}/target/debug/armada-server-parity
      # armada in Rust (client/) runs every client parity case against a
      # recorded AdminService beside Go's client: the same output, exit
      # codes, requests, and config files.
      - run: make client-parity
      # armadad in Rust (daemon/) runs every daemon parity case beside Go's
      # armadad: the same output, exit codes, and files left behind.
      - run: make daemon-parity
      # The node agent's loop in Rust (ADR 0055) is driven through the
      # same scenarios as Go's agent against one fake runtime the test
      # answers for both (a test clock, an mTLS control plane for the
      # session): the same reports, runtime calls, and files after every
      # step; its test program is built only for this.
      - run: cargo clippy --locked -p armada-agent --all-targets --features parity -- -D warnings
      - run: make agent-parity
      - run: go test -race -run 'TestAgentParity' -v ./internal/agent/
        env:
          ARMADA_AGENT_BIN: ${{ github.workspace }}/target/debug/armada-agent-parity

  # Validates the rendered HAProxy configuration with the pinned image.
  haproxy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -tags integration -run Integration -v ./internal/proxy/haproxy/

  vuln:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The module proxy sometimes drops a download; retry fetching, never
      # the check itself, so a finding still fails the job.
      - name: Download modules and tools
        run: |
          for i in 1 2 3; do
            go mod download && go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 && go install github.com/google/go-licenses/v2@v2.0.1 && exit 0
            echo "download failed (attempt $i), retrying"
            sleep 15
          done
          exit 1
      - run: "\"$(go env GOPATH)/bin/govulncheck\" ./..."
      # Every Go module must be under a license that allows commercial use
      # (THIRD_PARTY_NOTICES.md).
      - run: make licenses

  # The condition is on the steps, not the job: a skipped matrix job reports
  # one check named "build", never the "build (linux, amd64)" and
  # "build (linux, arm64)" the ruleset requires, so documents-only pull
  # requests could not merge.
  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Go's commands still build while Go is in the repository (ADR 0055,
      # item 20); releases build armadad and armada from Rust (job logger
      # builds the workspace for both architectures, client-macos the
      # client for macOS).
      - if: needs.changes.outputs.code == 'true'
        run: go build -trimpath -o /dev/null ./cmd/armada ./cmd/armadad
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - if: needs.changes.outputs.code == 'true'
        run: go build -trimpath -o /dev/null ./cmd/armada
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}

  # The Rust armada client for macOS (ADR 0055), as the release builds it.
  client-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/darwin-client.yml

  # armada-log (logger/), armada-shim (shim/), and armada-dns (dns/): the
  # Rust programs release builds embed. Lint, unit tests, static builds for
  # both architectures, the comparison of armada-log with the Go writer it
  # must match byte for byte, armada-dns against the Go resolver's tests,
  # and the Cargo workspace at the root (ADR 0055: armada-node of ADR 0054
  # and the crates of ADR 0055): its crates' licenses, its members built
  # for both architectures, and the parity tests against the Go code.
  logger:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Crates, cargo-deny, and build output kept between runs (keyed by
      # the lock and the toolchain), so a run builds only what changed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
            target
            logger/target
            shim/target
            dns/target
          key: rust-logger-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '*/Cargo.lock') }}
          restore-keys: rust-logger-
      # rustup is on the runner; the toolchain comes from rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: logger
      - run: cargo fmt --check
        working-directory: logger
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: logger
      - run: cargo test --locked
        working-directory: logger
      - run: rustup toolchain install
        working-directory: shim
      - run: cargo fmt --check
        working-directory: shim
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: shim
      - run: cargo test --locked
        working-directory: shim
      - run: rustup toolchain install
        working-directory: dns
      - run: cargo fmt --check
        working-directory: dns
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: dns
      - run: cargo test --locked
        working-directory: dns
      # The workspace: rust-toolchain.toml, deny.toml, and Cargo.lock at
      # the root cover every member.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The cache may restore cargo-deny already; install it only when the
      # pinned version is missing.
      - run: |
          cargo deny --version 2>/dev/null | grep -qx 'cargo-deny 0.22.0' ||
            cargo install cargo-deny --locked --force --version 0.22.0
      - run: cargo deny --locked check licenses
      - run: make logger
      - run: make shim
      - run: make dns
      # Every member (armada-node included) builds for both release targets (armada-proto has no
      # program yet).
      - run: cargo build --release --locked --workspace --target x86_64-unknown-linux-musl
      - run: cargo build --release --locked --workspace --target aarch64-unknown-linux-musl
      # The generator of `make proto`, outside the workspace (its own lock).
      - run: cargo fmt --check
        working-directory: proto/gen
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: proto/gen
      - run: go test -race -run 'TestArmadaLog|TestLoggerStandardLibraryOnly' -v ./internal/runtime/embedded/
        env:
          ARMADA_LOG_BIN: ${{ github.workspace }}/logger/target/x86_64-unknown-linux-musl/release/armada-log
      # armada-dns answers what the Go resolver's tests ask (ADR 0053).
      - run: go test -race -run 'TestProcess|TestStartProcess' -v ./internal/dnsserver/
        env:
          ARMADA_DNS_BIN: ${{ github.workspace }}/dns/target/x86_64-unknown-linux-musl/release/armada-dns
      - run: go test -race -run 'TestArmadaNode|TestRenderFallsBack' -v ./internal/proxy/haproxy/ ./internal/clusternet/ ./internal/runtime/ ./internal/runtime/containerd/
        env:
          ARMADA_NODE_BIN: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/armada-node
      # The spec crate parses, checks, exports, and substitutes as
      # internal/spec does (ADR 0055); its test program, built above with
      # the workspace, is never packed.
      - run: go test -race -run 'TestArmadaSpec' -v ./internal/spec/
        env:
          ARMADA_SPEC_BIN: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/armada-spec-check

  installer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh scripts/*.sh test/e2e/*.sh test/bench/*.sh
      - run: sh test/install_test.sh

  release-config:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check

  # The release's packaging end to end without publishing or signing, on
  # pushes to main (a pull request runs release-config's check only): the
  # runtime pack, armadad and armada from Rust for both architectures, the
  # macOS client from client-macos, the archives with their files, the
  # checksums, and the SBOMs. Then what installers and upgraders read: the
  # archive names and their binaries and units, and the version string.
  release-dry-run:
    needs: [changes, client-macos]
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: rustup toolchain install
        working-directory: logger
      - run: rustup toolchain install
        working-directory: shim
      - run: rustup toolchain install
        working-directory: dns
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: armada-darwin
          path: target
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign
      - run: sh scripts/release-contents.sh dist
