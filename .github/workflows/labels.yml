name: labels

# Keeps the repository labels in line with .github/labels.json, and labels
# pull requests: an area label per changed path (.github/labeler.yml) and a
# type label from the Conventional Commits prefix of the title.
#
# pull_request_target runs with the base branch's workflow and config and
# never checks out the pull request's code, so a pull request from a fork
# can be labelled without running anything it contains.
on:
  push:
    branches: [main]
    paths: [.github/labels.json]
  workflow_dispatch:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      issues: write # labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/sync-labels.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      - name: Type label from the title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          type=$(printf '%s' "$TITLE" | sed -nE 's/^([a-z]+)(\([a-z0-9._\/-]+\))?(!?): .*/\1\3/p')
          case "${type%!}" in
            feat) label=enhancement ;;
            fix) label=bug ;;
            security) label=security ;;
            perf) label=performance ;;
            docs) label=documentation ;;
            deps) label=dependencies ;;
            ci | build) label=ci ;;
            refactor) label=refactor ;;
            test) label=tests ;;
            chore | style) label=chore ;;
            *) label= ;;
          esac
          if [ -n "$label" ]; then gh pr edit "$PR" --add-label "$label"; fi
          case "$type" in *!) gh pr edit "$PR" --add-label breaking ;; esac
