name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The armada client for macOS, built on macOS with the tag as its version
  # (ADR 0055); the release job packs it.
  darwin:
    permissions:
      contents: read
    uses: ./.github/workflows/darwin-client.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: darwin
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # keyless cosign signing and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only reviewed code is released: the tagged commit must be on main
      # (docs/releasing.md). The tag ruleset decides who may push v* tags.
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not a commit of main"
            exit 1
          fi
      # armadad and armada are Rust programs (ADR 0055): GoReleaser builds
      # them with cargo after `make runtime-bundle`, which builds armada-log
      # (logger/), armada-shim (shim/), armada-dns (dns/), and armada-node
      # (node/, in the Cargo workspace at the root) and packs the runtime.
      # rustup is on the runner; the toolchains are pinned in
      # rust-toolchain.toml.
      - run: |
          for d in logger shim dns .; do (cd "$d" && rustup toolchain install); done
      # The gates CI runs, on the whole workspace: never release a build
      # that fails them. Formats and lints, tests, the replays, and the
      # crates' licenses and advisories; then the programs outside the
      # workspace.
      - run: cargo install cargo-deny --locked --version 0.22.0
      - run: make lint test replays vuln programs-check
      # The macOS client the darwin job built, where GoReleaser's darwin
      # build takes it (scripts/release-darwin.sh).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: armada-darwin
          path: target
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
