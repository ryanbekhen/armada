# GoReleaser configuration for signed Armada releases (see docs/releasing.md).
version: 2

project_name: armada

before:
  hooks:
    - go mod verify
    - make runtime-bundle

builds:
  - id: armada
    main: ./cmd/armada
    binary: armada
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    tags: [bundle]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/ryanbekhen/armada/internal/version.version={{ .Tag }}
      - -X github.com/ryanbekhen/armada/internal/version.commit={{ .FullCommit }}
      - -X github.com/ryanbekhen/armada/internal/version.date={{ .CommitDate }}

archives:
  - id: armada
    ids: [armada]
    formats: [tar.gz]
    name_template: "armada_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - deploy/systemd/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

# Keyless signature of the checksum file. install.sh verifies it with
# `cosign verify-blob` against this repository's release workflow identity.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

release:
  github:
    owner: ryanbekhen
    name: armada
  prerelease: auto
  draft: true
  footer: |
    ## Install or upgrade

    ```bash
    curl -fsSLO https://raw.githubusercontent.com/ryanbekhen/armada/{{ .Tag }}/install.sh
    less install.sh     # read what you are about to run as root
    sudo ARMADA_VERSION={{ .Tag }} sh install.sh
    ```

    `install.sh` verifies the cosign signature of `checksums.txt` (when
    cosign is installed) and the SHA-256 of the archive. Upgrading a
    cluster: see the [operations guide](https://github.com/ryanbekhen/armada/blob/{{ .Tag }}/docs/operations.md#upgrades).
    Verifying by hand: see [releasing](https://github.com/ryanbekhen/armada/blob/{{ .Tag }}/docs/releasing.md#verifying-a-release-by-hand).

# Release notes are grouped by the Conventional Commits type of each
# commit subject (see docs/releasing.md); CI checks the subjects of every
# pull request. Entries may start with the commit hash.
changelog:
  use: github
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - '^(?:[0-9a-f]+: )?(test|ci|chore|style|build)(\([^)]+\))?!?: '
      - '^(?:[0-9a-f]+: )?Merge (pull request|branch) '
  groups:
    - title: Breaking changes
      regexp: '^(?:[0-9a-f]+: )?[a-z]+(\([^)]+\))?!: '
      order: 0
    - title: Features
      regexp: '^(?:[0-9a-f]+: )?feat(\([^)]+\))?: '
      order: 1
    - title: Security
      regexp: '^(?:[0-9a-f]+: )?security(\([^)]+\))?: '
      order: 2
    - title: Bug fixes
      regexp: '^(?:[0-9a-f]+: )?fix(\([^)]+\))?: '
      order: 3
    - title: Performance
      regexp: '^(?:[0-9a-f]+: )?perf(\([^)]+\))?: '
      order: 4
    - title: Documentation
      regexp: '^(?:[0-9a-f]+: )?docs(\([^)]+\))?: '
      order: 5
    - title: Dependencies
      regexp: '^(?:[0-9a-f]+: )?deps(\([^)]+\))?: '
      order: 6
    - title: Other changes
      order: 999
