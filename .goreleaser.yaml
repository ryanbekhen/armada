# GoReleaser configuration for signed Armada releases (see docs/releasing.md).
version: 2

project_name: armada

# Nothing here needs Go (ADR 0055, item 20): armada-pack (pack/) builds the
# runtime pack from pack/lock.json and collects the license files of the
# Go modules the pack's etcd programs link and crun's license texts
# (licenses/runtime), and crun's complete corresponding source
# (source/runtime, ADR 0056); scripts/rust-licenses.sh the crates' license
# files (licenses/rust).
before:
  hooks:
    - make runtime-bundle
    - make runtime-licenses
    - make runtime-sources
    - make rust-licenses

builds:
  # armadad and armada are built from Rust (ADR 0055) by GoReleaser's rust
  # builder running `cargo build` (not zigbuild): static musl programs for
  # both Linux architectures, linked by rust-lld with ring's C compiled by
  # clang (.cargo/config.toml), the toolchain pinned in rust-toolchain.toml.
  # The version `armada version` and `armadad version` print is read by
  # client/build.rs from ARMADA_VERSION, ARMADA_COMMIT, and ARMADA_DATE.

  # The daemon: control plane, agent, machine commands, and the runtime
  # pack `make runtime-bundle` builds, compiled in by the bundle feature
  # (daemon/build.rs).
  - id: armadad
    builder: rust
    binary: armadad
    targets: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    tool: cargo
    command: build
    flags: [--release, --locked, --package=armada-daemon, --features=bundle]
    env: &version
      - ARMADA_VERSION={{ .Tag }}
      - ARMADA_COMMIT={{ .FullCommit }}
      - ARMADA_DATE={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The client, for the machines of the cluster and for workstations.
  - id: armada-linux
    builder: rust
    binary: armada
    targets: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    tool: cargo
    command: build
    flags: [--release, --locked, --package=armada-client]
    env: *version
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The client for macOS, built on a macOS runner by the darwin-client
  # workflow (no macOS SDK on Linux) with the same version variables, and
  # put in target/<target>/release/armada before GoReleaser runs; the
  # script checks it in cargo's place.
  - id: armada-darwin
    builder: rust
    binary: armada
    targets: [x86_64-apple-darwin, aarch64-apple-darwin]
    tool: sh
    command: scripts/release-darwin.sh
    flags: [--package=armada-client]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Linux: both binaries, each its own file (ADR 0055), and the systemd
  # units, which install.sh and armadad upgrade take from the archive.
  - id: armada
    ids: [armadad, armada-linux]
    formats: [tar.gz]
    name_template: "armada_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - third_party/licenses/*
      - src: build/licenses-rust/**/*
        dst: licenses/rust
      - src: build/licenses-runtime/**/*
        dst: licenses/runtime
      # The glob above takes the modules' directories only; a single file's
      # dst is its full path.
      - src: build/licenses-runtime/MODULES.txt
        dst: licenses/runtime/MODULES.txt
      # crun's complete corresponding source (GPL-2.0, section 3(a); ADR
      # 0056), in the archive that carries armadad and with it the pack.
      # One level of glob: GoReleaser drops the directories every match
      # shares, so "**/*" would lose crun-<version>/.
      - src: build/sources-runtime/*
        dst: source/runtime
      - README.md
      - SECURITY.md
      - deploy/systemd/*
  # Linux: the client only (ARMADA_CLIENT_ONLY=1), a few MB instead of the
  # daemon's archive.
  - id: armada-client-linux
    ids: [armada-linux]
    formats: [tar.gz]
    name_template: "armada-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - third_party/licenses/*
      - src: build/licenses-rust/**/*
        dst: licenses/rust
      - README.md
      - SECURITY.md
  # macOS: the client only.
  - id: armada-client
    ids: [armada-darwin]
    formats: [tar.gz]
    name_template: "armada_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - third_party/licenses/*
      - src: build/licenses-rust/**/*
        dst: licenses/rust
      - README.md
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

# Keyless signature of the checksum file. install.sh verifies it with
# `cosign verify-blob` against this repository's release workflow identity.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

release:
  github:
    owner: ryanbekhen
    name: armada
  prerelease: auto
  draft: true
  footer: |
    ## Install or upgrade

    ```bash
    curl -fsSLO https://raw.githubusercontent.com/ryanbekhen/armada/{{ .Tag }}/install.sh
    less install.sh     # read what you are about to run as root
    sudo ARMADA_VERSION={{ .Tag }} sh install.sh
    ```

    `install.sh` verifies the cosign signature of `checksums.txt` (when
    cosign is installed) and the SHA-256 of the archive. Upgrading a
    cluster: see the [operations guide](https://github.com/ryanbekhen/armada/blob/{{ .Tag }}/docs/operations.md#upgrades).
    Verifying by hand: see [releasing](https://github.com/ryanbekhen/armada/blob/{{ .Tag }}/docs/releasing.md#verifying-a-release-by-hand).

# Release notes are grouped by the Conventional Commits type of each
# commit subject (see docs/releasing.md); CI checks the subjects of every
# pull request. Entries may start with the commit hash.
changelog:
  use: github
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - '^(?:[0-9a-f]+: )?(test|ci|chore|style|build)(\([^)]+\))?!?: '
      - '^(?:[0-9a-f]+: )?Merge (pull request|branch) '
  groups:
    - title: Breaking changes
      regexp: '^(?:[0-9a-f]+: )?[a-z]+(\([^)]+\))?!: '
      order: 0
    - title: Features
      regexp: '^(?:[0-9a-f]+: )?feat(\([^)]+\))?: '
      order: 1
    - title: Security
      regexp: '^(?:[0-9a-f]+: )?security(\([^)]+\))?: '
      order: 2
    - title: Bug fixes
      regexp: '^(?:[0-9a-f]+: )?fix(\([^)]+\))?: '
      order: 3
    - title: Performance
      regexp: '^(?:[0-9a-f]+: )?perf(\([^)]+\))?: '
      order: 4
    - title: Documentation
      regexp: '^(?:[0-9a-f]+: )?docs(\([^)]+\))?: '
      order: 5
    - title: Dependencies
      regexp: '^(?:[0-9a-f]+: )?deps(\([^)]+\))?: '
      order: 6
    - title: Other changes
      order: 999
