# Armada's Rust code (ADR 0055): one workspace, one Cargo.lock, built with
# --locked. armada-log (logger/), armada-shim (shim/), and armada-dns
# (dns/) use the Rust standard library only and stay outside it, each with
# its own lock file and checks. proto/gen, the generator `make proto` runs,
# is outside it too: it is never linked into a program, and prost-build
# brings a crate under a license outside the list (foldhash, Zlib, through
# petgraph), which the workspace's lock file must not hold.
[workspace]
resolver = "3"
members = ["node", "proto", "fsutil", "pki", "secrets", "spec", "store", "server", "client", "agent", "daemon", "pack"]
exclude = ["logger", "shim", "dns"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Crates under the licenses of ADR 0054 and ADR 0055 only, checked from
# Cargo.lock in CI (cargo deny, deny.toml) and listed in
# THIRD_PARTY_NOTICES.md.
[workspace.dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
ring = { version = "0.17", default-features = false, features = ["alloc"] }
ruzstd = { version = "0.9", default-features = false, features = ["std", "hash"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets"] }

# The CA and certificates (pki/): rcgen issues certificates and reads
# requests, x509-parser reads certificates and checks their signatures,
# both on ring.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
time = { version = "0.3", default-features = false, features = ["std"] }
x509-parser = { version = "0.18", default-features = false, features = ["verify"] }

# Time zones of specs (spec/): TZif data and the bundled database, used
# under MIT.
jiff = { version = "1", default-features = false, features = ["std", "tzdb-bundle-always"] }

# The protocol (proto/): messages, gRPC services, and protobuf JSON. The
# code is generated by `make proto` (proto/gen, which pins the generators of
# the same releases) and checked in.
pbjson = "=0.9.0"
prost = { version = "=0.14.6", default-features = false, features = ["std", "derive"] }
tonic = { version = "=0.14.9", default-features = false, features = ["codegen"] }
tonic-prost = "=0.14.9"

# The store (store/): etcd's gRPC API over HTTP/2 (tonic's channel, on
# hyper and tower) with TLS 1.3 on rustls and ring, under tokio.
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-std", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }

# Debug builds (tests, clippy's builds, the replays) keep only line tables:
# backtraces still name files and lines, and builds and links are faster
# with far less to write. The test profile inherits it.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
