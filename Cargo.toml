# Armada's Rust code (ADR 0055): one workspace, one Cargo.lock, built with
# --locked. armada-log (logger/), armada-shim (shim/), and armada-dns
# (dns/) use the Rust standard library only and stay outside it, each with
# its own lock file and checks. proto/gen, the generator `make proto` runs,
# is outside it too: it is never linked into a program, and prost-build
# brings a crate under a license outside the list (foldhash, Zlib, through
# petgraph), which the workspace's lock file must not hold.
[workspace]
resolver = "3"
members = ["node", "proto"]
exclude = ["logger", "shim", "dns"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Crates under the licenses of ADR 0054 and ADR 0055 only, checked from
# Cargo.lock in CI (cargo deny, deny.toml) and listed in
# THIRD_PARTY_NOTICES.md.
[workspace.dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
ring = { version = "0.17", default-features = false, features = ["alloc"] }
ruzstd = { version = "0.8", default-features = false, features = ["std", "hash"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets"] }

# The protocol (proto/): messages, gRPC services, and protobuf JSON. The
# code is generated by `make proto` (proto/gen, which pins the generators of
# the same releases) and checked in.
pbjson = "=0.9.0"
prost = { version = "=0.14.6", default-features = false, features = ["std", "derive"] }
tonic = { version = "=0.14.9", default-features = false, features = ["codegen"] }
tonic-prost = "=0.14.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
