[package]
name = "armada-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The node agent: a library armadad agent links"

[dependencies]
armada-fsutil = { path = "../fsutil" }
# The cluster network and HAProxy's configuration in process, the
# broker URLs of queue readings (net/url), the machine's roots, and the
# HTTP pieces of the log export.
armada-node = { path = "../node" }
# The log export's gzipped requests.
flate2.workspace = true
armada-pki = { path = "../pki" }
armada-proto = { path = "../proto" }
armada-spec = { path = "../spec" }
# The session: tonic's channel over a TLS 1.3 connection made here
# (rustls with ring, the node certificate presented on every handshake).
hyper-util.workspace = true
# The wake socket (wake.rs): HTTP/1.1 from the node's proxy, forwarded to
# the replica that woke up.
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
libc.workspace = true
prost.workspace = true
# HAProxy's default certificate (haproxy/mod.rs), as armada-pki signs.
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
# armada-node's requests and answers, and the parity program's.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["channel"] }
tower.workspace = true

[dev-dependencies]
# Paused clocks in the tests of the drivers' waits.
tokio = { workspace = true, features = ["test-util"] }
# The replayed scenarios' control plane (tests/replay/side.rs): tonic's
# server over TLS connections accepted there.
tonic = { workspace = true, features = ["server"] }

[features]
# The program the agent's replays drive (src/bin/armada-agent-parity.rs),
# and the replay of their recorded scenarios
# (tests/scenarios.rs) with its fake armada-node: never part of a release.
parity = []

[[bin]]
name = "armada-agent-parity"
required-features = ["parity"]

[[bin]]
name = "armada-agent-fake-node"
required-features = ["parity"]

[[test]]
name = "scenarios"
required-features = ["parity"]
