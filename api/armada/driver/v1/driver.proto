syntax = "proto3";

package armada.driver.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ryanbekhen/armada/api/armada/driver/v1;driverv1";

// Driver runs containers for the Armada agent on one node (ADR 0015). It is
// served on a root-only Unix socket, /run/armada/drivers/NAME.sock. The
// protocol only grows: new features are new capabilities and fields.
//
// Errors use gRPC status codes: NOT_FOUND for a missing container or
// image, FAILED_PRECONDITION with a PlatformError detail for an image
// without a variant for the node, INVALID_ARGUMENT for a spec the driver
// refuses.
service Driver {
  // Info is the handshake: protocol version, identity, capabilities.
  rpc Info(InfoRequest) returns (InfoResponse);
  // Ping verifies that the engine is reachable and supported.
  rpc Ping(PingRequest) returns (PingResponse);
  // Pull fetches an image for the node's platform.
  rpc Pull(PullRequest) returns (PullResponse);
  // Run creates and starts an app container.
  rpc Run(RunRequest) returns (RunResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  // List returns containers (running or not) carrying all given labels.
  rpc List(ListRequest) returns (ListResponse);
  rpc Inspect(InspectRequest) returns (Container);
  // Logs streams a container's output; with follow, until it is cancelled
  // or the container stops.
  rpc Logs(LogsRequest) returns (stream LogFrame);

  // Needs CAPABILITY_SYSTEM_CONTAINERS.
  rpc RunSystem(RunSystemRequest) returns (RunResponse);
  rpc Exec(ExecRequest) returns (ExecResponse);
  rpc Signal(SignalRequest) returns (SignalResponse);

  // Needs CAPABILITY_BRIDGE.
  rpc Bridge(BridgeRequest) returns (BridgeResponse);
}

// The major version of this protocol. The agent refuses drivers that
// report another one.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_1 = 1;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // RunSystem, Exec, and Signal: host-network infrastructure containers
  // (the node's HAProxy).
  CAPABILITY_SYSTEM_CONTAINERS = 1;
  // Bridge: the network app containers share with the host, for internal
  // DNS and internal ingress.
  CAPABILITY_BRIDGE = 2;
}

message InfoRequest {}

message InfoResponse {
  ProtocolVersion protocol = 1;
  // name matches the socket name; version is free-form.
  string name = 2;
  string version = 3;
  // The node's platform as the engine sees it, e.g. "linux", "arm64".
  string os = 4;
  string arch = 5;
  repeated Capability capabilities = 6;
  // vm_isolation: every container runs in its own virtual machine with its
  // own kernel, so the driver may leave out no_new_privileges and the PID
  // limit (ADR 0016). The conformance suite checks the claim.
  bool vm_isolation = 7;
  // min_memory_bytes is the smallest memory limit the driver accepts; the
  // scheduler places no replica with a smaller limit on the node. 0: none.
  int64 min_memory_bytes = 8;
  // cpu_millis and memory_bytes are what the engine can give containers
  // when that is less than the machine has (a virtual machine of fixed
  // size, say); the node reports the smaller of the two. 0: the machine's.
  int64 cpu_millis = 9;
  int64 memory_bytes = 10;
}

message PingRequest {}
message PingResponse {}

message RegistryAuth {
  string username = 1;
  string password = 2 [debug_redact = true];
  string server_address = 3;
}

message PullRequest {
  string image = 1;
  RegistryAuth auth = 2;
}

message PullResponse {
  // The digest-pinned reference ("repo@sha256:..."), or "" if unknown.
  string ref = 1;
  // The image's platforms as "os/arch", if known.
  repeated string platforms = 2;
}

// PlatformError is the detail of a FAILED_PRECONDITION from Pull or Run
// when the image has no variant for the node.
message PlatformError {
  string image = 1;
  string want = 2;
  repeated string have = 3;
}

message FileMount {
  // A regular file on the node, mounted read-only.
  string source = 1;
  string target = 2;
}

// Security holds the defaults every app container gets. A driver must
// apply every field or refuse the container; the conformance suite checks
// them from inside.
message Security {
  // Always true.
  bool no_new_privileges = 1;
  // Capabilities removed from the engine's default set, e.g. "NET_RAW".
  repeated string drop_capabilities = 2;
}

// ContainerSpec describes an app container. There is no field for host
// networking, privileged mode, devices, or directory mounts: an app
// container never gets them.
message ContainerSpec {
  string name = 1;
  string image = 2;
  repeated string entrypoint = 3;
  repeated string cmd = 4;
  // KEY=VALUE pairs; may hold secret values.
  repeated string env = 5 [debug_redact = true];
  map<string, string> labels = 6;
  // The TCP port to publish on host_ip (a private address); 0 for none.
  int32 port = 7;
  string host_ip = 8;
  int64 memory_bytes = 9;
  // CPU limit in nano-CPUs; 0 for none.
  int64 nano_cpus = 10;
  // CPU reservation in millicores, for the container's CPU weight.
  int64 cpu_reserve_millis = 11;
  int64 pids_limit = 12;
  repeated FileMount files = 13;
  // Nameservers (private addresses); empty keeps the engine's default.
  repeated string dns = 14;
  Security security = 15;
}

message RunRequest {
  ContainerSpec spec = 1;
}

message RunResponse {
  string id = 1;
}

message StopRequest {
  string id = 1;
  int64 grace_millis = 2;
}

message StopResponse {}

message RemoveRequest {
  string id = 1;
}

message RemoveResponse {}

message ListRequest {
  map<string, string> labels = 1;
}

message ListResponse {
  repeated Container containers = 1;
}

message InspectRequest {
  string id = 1;
}

message Container {
  string id = 1;
  string name = 2;
  string image = 3;
  map<string, string> labels = 4;
  // created, running, restarting, exited, paused, or dead.
  string state = 5;
  int32 exit_code = 6;
  string host_ip = 7;
  int32 host_port = 8;
  // The container's address on its bridge, reachable from the node.
  string ip = 9;
  google.protobuf.Timestamp started_at = 10;
}

message LogsRequest {
  string id = 1;
  bool follow = 2;
  // Lines to show; 0 for all.
  int32 tail = 3;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

message LogFrame {
  LogStream stream = 1;
  bytes data = 2;
}

message Mount {
  string source = 1;
  string target = 2;
  bool read_only = 3;
}

// SystemSpec describes an Armada infrastructure container: host network,
// every capability dropped but cap_add. Only Armada builds these, never
// from user input.
message SystemSpec {
  string name = 1;
  string image = 2;
  repeated string cmd = 3;
  map<string, string> labels = 4;
  repeated Mount mounts = 5;
  repeated string cap_add = 6;
  string user = 7;
}

message RunSystemRequest {
  SystemSpec spec = 1;
}

message ExecRequest {
  string id = 1;
  repeated string cmd = 2;
}

message ExecResponse {
  string output = 1;
  int32 exit_code = 2;
}

message SignalRequest {
  string id = 1;
  string signal = 2;
}

message SignalResponse {}

message BridgeRequest {}

message BridgeResponse {
  // The host's address on the bridge and the bridge's subnet.
  string gateway = 1;
  string subnet = 2;
}
