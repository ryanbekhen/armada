syntax = "proto3";

package armada.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ryanbekhen/armada/api/armada/v1;armadav1";

// AdminService is called by the CLI. Callers must present an admin client
// certificate (CN "admin:<name>").
service AdminService {
  rpc Deploy(DeployRequest) returns (DeployResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  // ListApps lists apps one summary each, filtered and paged on the server
  // (ADR 0032).
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  // ClusterStatus summarizes the cluster in a bounded answer.
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
  // GetAppSpec returns the spec an app or job runs, as a file holds it.
  rpc GetAppSpec(GetAppSpecRequest) returns (GetAppSpecResponse);
  rpc Scale(ScaleRequest) returns (ScaleResponse);
  // SetTraffic changes how an app in multiple revision mode splits
  // requests, until its next deploy (ADR 0022).
  rpc SetTraffic(SetTrafficRequest) returns (SetTrafficResponse);
  // Volumes (ADR 0023): list them, remove one, and stream a backup of one
  // out of, or a restore into, the node that holds it.
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc RemoveVolume(RemoveVolumeRequest) returns (RemoveVolumeResponse);
  rpc BackupVolume(BackupVolumeRequest) returns (stream VolumeData);
  rpc RestoreVolume(stream RestoreVolumeMessage) returns (RestoreVolumeResponse);
  // Backups in the volume's bucket (ADR 0041).
  rpc ListVolumeSnapshots(ListVolumeSnapshotsRequest) returns (ListVolumeSnapshotsResponse);
  rpc CreateVolumeSnapshot(CreateVolumeSnapshotRequest) returns (CreateVolumeSnapshotResponse);
  rpc RestoreVolumeSnapshot(RestoreVolumeSnapshotRequest) returns (RestoreVolumeResponse);
  rpc Logs(LogsRequest) returns (stream LogEntry);
  rpc GetClusterConfig(GetClusterConfigRequest) returns (ClusterConfig);
  rpc SetClusterConfig(SetClusterConfigRequest) returns (ClusterConfig);
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse);
  rpc VerifyDomain(VerifyDomainRequest) returns (Domain);
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse);
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);
  rpc CordonNode(CordonNodeRequest) returns (CordonNodeResponse);
  rpc LabelNode(LabelNodeRequest) returns (LabelNodeResponse);
  rpc RestrictNode(RestrictNodeRequest) returns (RestrictNodeResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc RemoveServer(RemoveServerRequest) returns (RemoveServerResponse);
  // Spaces (ADR 0026). Every other RPC names an app by its ID:
  // <name>.<space>, or the bare name in the default space.
  rpc CreateSpace(CreateSpaceRequest) returns (SpaceInfo);
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse);
  // Change a space's settings (administrators only). Today only the
  // default space's network isolation, which other spaces always have.
  rpc UpdateSpace(UpdateSpaceRequest) returns (SpaceInfo);
  // Access control (ADR 0033): users (people) and services (tools) hold
  // roles in the cluster or in one space. Only cluster-admin manages
  // them.
  // CreateUser records a user with their first roles and signs a
  // certificate for the key in the CSR.
  rpc CreateUser(CreateUserRequest) returns (IssueMetricsCertificateResponse);
  // IssueUserCertificate gives a user a new certificate; the ones issued
  // earlier stop working.
  rpc IssueUserCertificate(IssuePrincipalCertificateRequest) returns (IssueMetricsCertificateResponse);
  // CreateService records a service; it gets certificates (90 days) with
  // IssueServiceCertificate.
  rpc CreateService(CreateServiceRequest) returns (Principal);
  rpc IssueServiceCertificate(IssuePrincipalCertificateRequest) returns (IssueMetricsCertificateResponse);
  rpc ListPrincipals(ListPrincipalsRequest) returns (ListPrincipalsResponse);
  // UpdatePrincipal replaces the node labels a principal's apps may
  // require.
  rpc UpdatePrincipal(UpdatePrincipalRequest) returns (Principal);
  // DeletePrincipal revokes every certificate of a user or service.
  rpc DeletePrincipal(DeletePrincipalRequest) returns (DeletePrincipalResponse);
  rpc CreateAssignment(AssignmentRequest) returns (Principal);
  rpc DeleteAssignment(AssignmentRequest) returns (Principal);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  // RenewOwnCertificate gives the caller, a user or a service, a new
  // certificate for the key in its CSR. A service's other certificates are
  // revoked; a user's stay valid until they expire.
  rpc RenewOwnCertificate(RenewOwnCertificateRequest) returns (IssueMetricsCertificateResponse);
  // Exec runs a command in one replica of an app (ADR 0015). The first
  // client message is start; the server's first message names the replica
  // and its last the exit code.
  rpc Exec(stream ExecClientMessage) returns (stream ExecServerMessage);
  // Top reports the CPU and memory replicas use, from the latest samples
  // their agents sent (ADR 0016).
  rpc Top(TopRequest) returns (TopResponse);
  // IssueMetricsCertificate signs a client certificate that may only
  // scrape the metrics endpoint (ADR 0017).
  rpc IssueMetricsCertificate(IssueMetricsCertificateRequest) returns (IssueMetricsCertificateResponse);
  // Events streams what the cluster did (ADR 0018), oldest first; with
  // follow, then new events until the caller cancels.
  rpc Events(EventsRequest) returns (stream EventInfo);
  // Jobs (ADR 0019): start a run now, list jobs and their runs, cancel the
  // running run, delete a job with its runs.
  rpc RunJob(RunJobRequest) returns (RunJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc ListJobRuns(ListJobRunsRequest) returns (ListJobRunsResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);

  // RemoveApp drains an app's replicas and then removes it with its revisions
  // and secrets. Its volumes stay until `armada volume delete`.
  rpc RemoveApp(RemoveAppRequest) returns (RemoveAppResponse);
}

message RunJobRequest {
  string job = 1;
}

message RunJobResponse {
  int64 run = 1;
}

message ListJobsRequest {}

message ListJobsResponse {
  repeated JobInfo jobs = 1;
}

message JobInfo {
  string name = 1;
  string revision = 2;
  string image = 3;
  string schedule = 4;
  string time_zone = 5;
  // Unset for jobs without a schedule.
  google.protobuf.Timestamp next_run = 6;
  // The newest run, if any.
  JobRunInfo last_run = 7;
  // Runs pending or running.
  int32 active = 8;
  // Set for jobs that a queue starts (ADR 0040).
  JobTrigger trigger = 9;
}

// JobTrigger is a job's queue trigger with what was last read.
message JobTrigger {
  // "redis" or "rabbitmq".
  string type = 1;
  // The Redis list or the RabbitMQ queue.
  string name = 2;
  int64 per_run = 3;
  int32 parallelism = 4;
  int64 polling_interval_seconds = 5;
  // The node whose agent reads the queue; empty when no node can.
  string node = 6;
  // The latest length read, if measured.
  bool measured = 7;
  int64 length = 8;
  google.protobuf.Timestamp measured_at = 9;
}

message ListJobRunsRequest {
  string job = 1;
}

message ListJobRunsResponse {
  // Newest first.
  repeated JobRunInfo runs = 1;
}

message JobRunInfo {
  string job = 1;
  int64 run = 2;
  // pending, running, succeeded, failed, or cancelled.
  string state = 3;
  // schedule or manual.
  string trigger = 4;
  string revision = 5;
  int32 attempts = 6;
  string node = 7;
  // The replica of the latest attempt, whose logs `armada job logs` shows.
  string replica = 8;
  int32 exit_code = 9;
  string message = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp finished_at = 13;
}

message CancelJobRequest {
  string job = 1;
}

message CancelJobResponse {
  // The cancelled runs.
  repeated int64 runs = 1;
}

message DeleteJobRequest {
  string job = 1;
}

message DeleteJobResponse {}

message RemoveAppRequest {
  string app = 1;
}

message RemoveAppResponse {}

message EventsRequest {
  // Optional filters.
  string app = 1;
  string node = 2;
  // How far back to start; 0 means one hour, at most 24 hours.
  int64 since_seconds = 3;
  bool follow = 4;
}

message EventInfo {
  // replica, rollout, node, app, domain, or certificate.
  string kind = 1;
  string object = 2;
  string app = 3;
  string node = 4;
  string reason = 5;
  // Control characters are replaced; at most 512 bytes.
  string message = 6;
  // How often it happened between first and last.
  int32 count = 7;
  google.protobuf.Timestamp first = 8;
  google.protobuf.Timestamp last = 9;
}

message IssueMetricsCertificateRequest {
  // The certificate's name: metrics:<name>.
  string name = 1;
  // PKCS#10 request for a key generated by the caller; only its public key
  // is used.
  bytes csr = 2;
}

message IssueMetricsCertificateResponse {
  bytes cert = 1;
  bytes ca_cert = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CreateSpaceRequest {
  string name = 1;
}

message SpaceInfo {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  string created_by = 3;
  // Apps and jobs in the space.
  int32 apps = 4;
  // Its containers are kept away from the platform and the private network
  // (ADR 0026): always for spaces other than default.
  bool network_isolation = 5;
}

message UpdateSpaceRequest {
  string name = 1;
  // Turn network isolation on or off; only the default space may have
  // it off. Unset leaves it unchanged.
  optional bool network_isolation = 2;
}

message ListSpacesRequest {}

message ListSpacesResponse {
  repeated SpaceInfo spaces = 1;
}

message DeleteSpaceRequest {
  string name = 1;
}

message DeleteSpaceResponse {}

message RoleAssignment {
  string role = 1;
  // Empty for a role over the whole cluster.
  string space = 2;
}

message LabelAllowance {
  string key = 1;
  repeated string values = 2;
}

message Principal {
  // user or service.
  string kind = 1;
  string name = 2;
  repeated RoleAssignment roles = 3;
  // Node label values its apps' placement.require may name.
  repeated LabelAllowance labels = 4;
  google.protobuf.Timestamp created_at = 5;
  string created_by = 6;
  // Deleted users keep a record so their certificates stay refused.
  bool removed = 7;
  // Services: the newest valid certificate's expiry, and how many are
  // valid.
  google.protobuf.Timestamp cert_expires_at = 8;
  int32 certificates = 9;
}

message CreateUserRequest {
  string name = 1;
  // PKCS#10 request; only its public key is used.
  bytes csr = 2;
  repeated RoleAssignment roles = 3;
  repeated LabelAllowance labels = 4;
}

message CreateServiceRequest {
  string name = 1;
  repeated RoleAssignment roles = 2;
  repeated LabelAllowance labels = 3;
}

message IssuePrincipalCertificateRequest {
  string name = 1;
  // PKCS#10 request; only its public key is used.
  bytes csr = 2;
}

message ListPrincipalsRequest {
  // user, service, or empty for both.
  string kind = 1;
}

message ListPrincipalsResponse {
  repeated Principal principals = 1;
  // The caller.
  string you_kind = 2;
  string you = 3;
}

message UpdatePrincipalRequest {
  string kind = 1;
  string name = 2;
  repeated LabelAllowance labels = 3;
}

message DeletePrincipalRequest {
  string kind = 1;
  string name = 2;
}

message DeletePrincipalResponse {}

message AssignmentRequest {
  string kind = 1;
  string name = 2;
  RoleAssignment role = 3;
}

message ListRolesRequest {}

message RoleInfo {
  string name = 1;
  string description = 2;
  // Where it may be given: the cluster, a space, or both.
  bool cluster = 3;
  bool space = 4;
  // API methods it allows, besides cluster-admin's every method.
  repeated string methods = 5;
}

message ListRolesResponse {
  repeated RoleInfo roles = 1;
}

message RenewOwnCertificateRequest {
  // PKCS#10 request; only its public key is used.
  bytes csr = 1;
}

message ListServersRequest {}

message ListServersResponse {
  repeated ServerInfo servers = 1;
  // Schema the cluster state is written in.
  int32 state_schema = 2;
}

// ServerInfo describes a control plane node.
message ServerInfo {
  string name = 1;
  string private_ip = 2;
  string api_addr = 3;
  // The leader runs the reconcilers and serves the API.
  bool leader = 4;
  // False while a joining server catches up (an etcd learner).
  bool voting = 5;
  // False if the server has no etcd member (it was removed, or its join
  // never completed).
  bool member = 6;
  // Whether its etcd member answers.
  bool reachable = 7;
  // Newest state schema its binary understands, and its Armada version.
  int32 schema = 8;
  string version = 9;
}

message RemoveServerRequest {
  string name = 1;
}

message RemoveServerResponse {}

message CreateJoinTokenRequest {
  // Lifetime in seconds; 0 means the default (1 hour).
  int64 ttl_seconds = 1;
  // A server token adds a control plane node (JoinServer) instead of a
  // node (Join).
  bool server = 2;
  // Labels the node gets when it joins with this token (ADR 0014).
  map<string, string> labels = 3;
}

message CreateJoinTokenResponse {
  // "<id>.<secret>"; returned once and never stored in plaintext.
  string token = 1 [debug_redact = true];
  // Pin of the cluster CA, "sha256:<hex>".
  string ca_hash = 2;
  // Address of the join listener.
  string join_addr = 3;
  google.protobuf.Timestamp expires_at = 4;
  // Armada version of the server that created the token, so the new machine
  // can install the same release.
  string version = 5;
}

message CordonNodeRequest {
  string node = 1;
  bool cordoned = 2;
}

message CordonNodeResponse {}

// LabelNodeRequest sets and removes a node's admin labels.
message LabelNodeRequest {
  string node = 1;
  map<string, string> set = 2;
  repeated string remove = 3;
}

message LabelNodeResponse {
  // The node's admin labels after the change.
  map<string, string> labels = 1;
}

// A restricted node only runs apps whose placement selects one of its labels.
message RestrictNodeRequest {
  string node = 1;
  bool restricted = 2;
}

message RestrictNodeResponse {}

message RemoveNodeRequest {
  string node = 1;
  // Delete the node's replicas instead of requiring it to be evacuated.
  bool force = 2;
}

message RemoveNodeResponse {}

// JoinService is served on a separate listener that does not require a
// client certificate; Join is authorized by a join token.
service JoinService {
  rpc Join(JoinRequest) returns (JoinResponse);
  // JoinServer adds a control plane node. It requires a server token and
  // returns the cluster's keys, so the token must be handled like them.
  rpc JoinServer(JoinServerRequest) returns (JoinServerResponse);
}

message JoinServerRequest {
  string token_id = 1;
  string token_secret = 2 [debug_redact = true];
  string name = 3;
  string private_ip = 4;
  // PKCS#10 request for the key of the server's own node (its agent).
  bytes node_csr = 5;
  string version = 6;
  // Ports on private_ip for the API, the join listener (0: disabled), and
  // the etcd member.
  int32 api_port = 7;
  int32 join_port = 8;
  int32 etcd_peer_port = 9;
}

// JoinServerResponse carries every key a control plane node holds. Never
// log it.
message JoinServerResponse {
  bytes ca_cert = 1;
  bytes ca_key = 2 [debug_redact = true];
  bytes master_key = 3 [debug_redact = true];
  bytes server_cert = 4;
  bytes server_key = 5 [debug_redact = true];
  bytes node_cert = 6;
  // etcd's initial cluster for the new member ("name=peerURL,...").
  string initial_cluster = 7;
  // API addresses of every control plane node, the new one included.
  repeated string servers = 8;
  // The node's container subnet in the cluster network (ADR 0025); empty
  // when the cluster has none.
  string node_subnet = 9;
  // The cluster network's mode, "plain" or "wireguard"; empty when the
  // cluster has none.
  string network_mode = 10;
}

message JoinRequest {
  string token_id = 1;
  string token_secret = 2 [debug_redact = true];
  string node_name = 3;
  string private_ip = 4;
  // PKCS#10 request for the node's key, generated on the node.
  bytes csr = 5;
  string version = 6;
}

message JoinResponse {
  bytes node_cert = 1;
  bytes ca_cert = 2;
  reserved 3;
  // API addresses of every control plane node.
  repeated string servers = 4;
  // The node's container subnet in the cluster network (ADR 0025); empty
  // when the cluster has none.
  string node_subnet = 5;
  // The cluster network's mode, "plain" or "wireguard"; empty when the
  // cluster has none.
  string network_mode = 6;
}

// Secret values are write-only: no RPC returns them to admins. Fields that
// carry plaintext are marked debug_redact for tools that honor it;
// protobuf-go's String() does not, so never log messages holding secrets.
message SetSecretRequest {
  string app = 1;
  string name = 2;
  bytes value = 3 [debug_redact = true];
  // Roll the app out with the new value if its current revision uses the
  // secret.
  bool rollout = 4;
}

message SetSecretResponse {
  int32 version = 1;
  // New revision being rolled out, if any.
  string revision = 2;
}

message ListSecretsRequest {
  string app = 1;
}

message ListSecretsResponse {
  repeated SecretInfo secrets = 1;
}

message SecretInfo {
  string name = 1;
  int32 version = 2;
  google.protobuf.Timestamp updated_at = 3;
  string updated_by = 4;
  // Revisions of the app that pin some version of this secret.
  repeated string used_by = 5;
}

message DeleteSecretRequest {
  string app = 1;
  string name = 2;
}

message DeleteSecretResponse {}

message ListRevisionsRequest {
  string app = 1;
}

message ListRevisionsResponse {
  repeated RevisionInfo revisions = 1;
}

message RevisionInfo {
  string name = 1;
  string image = 2;
  // Image pinned by digest once a node pulled it; rollbacks use it.
  string image_digest = 3;
  google.protobuf.Timestamp created_at = 4;
  bool active = 5;
  bool target = 6;
  // The image's platforms ("os/arch") once a node reported them.
  repeated string platforms = 7;
}

message RollbackRequest {
  string app = 1;
  // Optional; defaults to the revision before the active one.
  string revision = 2;
}

message RollbackResponse {
  string revision = 1;
}

message ClusterConfig {
  // Apps get <app>.<root_domain> automatically when set.
  string root_domain = 1;
  string acme_email = 2;
  // Addresses of proxies in front of the nodes, as prefixes. Only requests
  // from these may carry client address headers past ingress.
  repeated string trusted_proxies = 3;
  // Server settings for the whole cluster (ADR 0031), as the leader uses
  // them: certificates on or off, the ACME directory, the DNS provider for
  // the root domain, whether a DNS token is stored (never the token), the
  // metrics port on each server's private address (0: off), and how long a
  // node may be unreachable before its replicas move.
  bool tls = 4;
  string acme_ca = 5;
  string dns_provider = 6;
  bool dns_token_set = 7;
  int32 metrics_port = 8;
  int64 node_lost_timeout_seconds = 9;
}

message GetClusterConfigRequest {}

message SetClusterConfigRequest {
  ClusterConfig config = 1;
  // Which fields of config change.
  bool set_root_domain = 2;
  bool set_trusted_proxies = 3;
  bool set_tls = 4;
  bool set_acme_email = 5;
  bool set_acme_ca = 6;
  bool set_dns_provider = 7;
  bool set_metrics_port = 8;
  bool set_node_lost_timeout = 9;
  // The DNS provider's API token, set when set_dns_token; empty removes it.
  // Never logged or returned.
  bool set_dns_token = 10;
  bytes dns_token = 11 [debug_redact = true];
}

message ListDomainsRequest {
  // Optional; empty means all domains.
  string app = 1;
}

message ListDomainsResponse {
  repeated Domain domains = 1;
}

message Domain {
  string name = 1;
  repeated string apps = 2;
  bool verified = 3;
  // DNS record the owner must create: TXT <txt_name> = <txt_value>.
  string txt_name = 4;
  string txt_value = 5;
  string message = 6;
  // True when a certificate is available for the domain.
  bool tls_ready = 7;
}

message VerifyDomainRequest {
  string name = 1;
}

message DeployRequest {
  // App spec as YAML, validated by the server.
  bytes spec = 1;
  // Space to deploy into (ADR 0026); empty means the default space.
  string space = 2;
  // Checks in the deploy's transaction (ADR 0032): refuse an app that
  // exists, one that does not, or one whose target revision is no longer
  // base_revision.
  bool must_create = 3;
  bool must_exist = 4;
  string base_revision = 5;
}

message ListAppsRequest {
  // A space, or every space the caller sees with all_spaces.
  string space = 1;
  bool all_spaces = 2;
  // At most page_size apps (default and limit 500) after page_token.
  int32 page_size = 3;
  string page_token = 4;
}

message AppSummary {
  // The app's ID (name, or name.space).
  string name = 1;
  string space = 2;
  string image = 3;
  string revision = 4;
  int32 ready = 5;
  int32 desired = 6;
  string ingress = 7;
  // The first URL, if any.
  string url = 8;
  // ready, progressing, failing, or idle (scaled to zero).
  string state = 9;
  // Why it is not ready, when it is not.
  string message = 10;
  // While a rollout runs: the revision rolled out, and its image.
  string target_revision = 11;
  string target_image = 12;
}

message ListAppsResponse {
  repeated AppSummary apps = 1;
  string next_page_token = 2;
}

message ClusterStatusRequest {}

message ClusterStatusResponse {
  int32 nodes = 1;
  int32 nodes_ready = 2;
  int32 apps = 3;
  int32 apps_ready = 4;
  int32 apps_progressing = 5;
  int32 apps_failing = 6;
  int32 jobs = 7;
  // Apps that are not ready, at most 20, and how many there are in all.
  repeated AppSummary attention = 8;
  int32 attention_total = 9;
  // Nodes that are not ready.
  repeated string nodes_not_ready = 10;
}

message GetAppSpecRequest {
  string app = 1;
}

message GetAppSpecResponse {
  // The spec as YAML.
  bytes spec = 1;
  // The revision it is the spec of: the app's target.
  string revision = 2;
}

message DeployResponse {
  string app = 1;
  string revision = 2;
}

message StatusRequest {
  // Optional; empty means all apps and the nodes. With an app the response
  // holds that app alone and no nodes.
  string app = 1;
  // Only the nodes, with their replica counts: no apps.
  bool nodes_only = 2;
}

message StatusResponse {
  repeated AppStatus apps = 1;
  repeated NodeStatus nodes = 2;
}

message AppStatus {
  string name = 1;
  string image = 2;
  string active_revision = 3;
  int32 desired_replicas = 4;
  repeated ReplicaStatus replicas = 5;
  string ingress = 6;
  repeated string urls = 7;
  // Revision being rolled out; equals active_revision when idle.
  string target_revision = 8;
  // "progressing", "failed", or empty.
  string rollout_state = 9;
  string rollout_message = 10;
  // Why replicas are missing, when no node can take them (ADR 0014).
  string placement_message = 11;
  // Set when scale.rules are (ADR 0020).
  Autoscale autoscale = 12;
  // How requests are split between revisions (ADR 0022).
  repeated TrafficTarget traffic = 13;
  // Who may reach the app from outside (ADR 0035); at most one is set.
  repeated IPRule ip_allow = 14;
  repeated IPRule ip_deny = 15;
}

// One client address rule, with what it is for.
message IPRule {
  string range = 1;
  string name = 2;
  string description = 3;
}

message Autoscale {
  int32 min = 1;
  int32 max = 2;
  repeated AutoscaleRule rules = 3;
  // What the autoscaler last decided, e.g. "holding: not enough samples".
  string message = 4;
  // When the autoscaler last changed the replica count; unset until it does.
  google.protobuf.Timestamp last_scaled_at = 5;
}

message AutoscaleRule {
  // "http", "cpu", "memory", "queue", or "schedule".
  string type = 1;
  // Target: requests in progress per replica, percent of the reservation,
  // queue items per replica, or a schedule's replicas.
  int64 target = 2;
  // Current average per ready replica, in the same unit; for queue the
  // queue's length, for schedule the replicas it asks for now (0 outside
  // its window). Valid if measured.
  int64 current = 3;
  bool measured = 4;
  // For an open schedule window: when it closes (ADR 0034).
  google.protobuf.Timestamp until = 5;
}

message ReplicaStatus {
  string id = 1;
  string revision = 2;
  string node_id = 3;
  string state = 4;
  string message = 5;
  // host:port on the node's private IP; empty if the app has no port.
  string address = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool ready = 8;
  // True while the replica is taken out of the proxy before removal.
  bool draining = 9;
  // When the replica was scheduled; unset for replicas from before it was kept.
  google.protobuf.Timestamp created_at = 10;
  // How often the agent recreated its container, when it last did, and why.
  int32 restarts = 11;
  google.protobuf.Timestamp last_restart_at = 12;
  string last_restart = 13;
}

message NodeStatus {
  string id = 1;
  string private_ip = 2;
  string state = 3;
  google.protobuf.Timestamp last_seen = 4;
  int64 cpu_millis = 5;
  int64 memory_bytes = 6;
  bool cordoned = 7;
  google.protobuf.Timestamp cert_expires_at = 8;
  // Armada version its agent last reported.
  string version = 9;
  // Admin labels plus armada.os and armada.arch.
  map<string, string> labels = 10;
  bool restricted = 11;
  // Replicas assigned to the node (not finished job attempts).
  int32 replicas = 12;
}

message TopRequest {
  // Optional; empty means all apps.
  string app = 1;
}

message TopResponse {
  repeated ReplicaTop replicas = 1;
  // Every node, with what its replicas use and reserve; empty when app is
  // set.
  repeated NodeTop nodes = 2;
  // Each space the caller may manage, with what its apps use; empty when
  // app is set (ADR 0026).
  repeated SpaceTop spaces = 3;
  // When this leader began counting SpaceTop.requests and egress_bytes.
  google.protobuf.Timestamp counted_since = 4;
}

message SpaceTop {
  string name = 1;
  int32 replicas = 2;
  // How many replicas have a recent sample in cpu_millis and memory_bytes.
  int32 measured = 3;
  int64 cpu_millis = 4;
  int64 memory_bytes = 5;
  int64 cpu_reserved_millis = 6;
  int64 memory_reserved_bytes = 7;
  // Bytes in the space's volumes, from their latest measurements.
  int64 volume_bytes = 8;
  // Requests the proxies sent to the space's replicas, and bytes its
  // containers sent, since counted_since.
  int64 requests = 9;
  int64 egress_bytes = 10;
}

message ReplicaTop {
  string id = 1;
  string app = 2;
  string node_id = 3;
  string state = 4;
  // False when the node sent no recent sample for the replica: it is not
  // running, or the node's runtime cannot measure containers.
  bool measured = 5;
  int64 cpu_millis = 6;
  int64 memory_bytes = 7;
  // What the replica reserves; cpu_limit_millis is 0 when the app sets no
  // CPU limit. The memory reservation is also its limit.
  int64 cpu_reserved_millis = 8;
  int64 cpu_limit_millis = 9;
  int64 memory_limit_bytes = 10;
  google.protobuf.Timestamp sampled_at = 11;
}

message NodeTop {
  string id = 1;
  // False when the node sent no recent sample.
  bool measured = 2;
  // What its replicas use, summed.
  int64 cpu_millis = 3;
  int64 memory_bytes = 4;
  // What its replicas reserve, and what the node can give replicas.
  int64 cpu_reserved_millis = 5;
  int64 memory_reserved_bytes = 6;
  int64 cpu_allocatable_millis = 7;
  int64 memory_allocatable_bytes = 8;
  int32 replicas = 9;
  // Connections its kernel tracks and the limit, from its latest sample; the
  // limit is 0 when unknown (ADR 0025).
  int64 conntrack_entries = 10;
  int64 conntrack_max = 11;
}

message ScaleRequest {
  string app = 1;
  int32 replicas = 2;
}

message ScaleResponse {}

message SetTrafficRequest {
  string app = 1;
  // Revision and weight; labels stay as they are.
  repeated TrafficTarget traffic = 2;
}

message SetTrafficResponse {
  repeated TrafficTarget traffic = 1;
}

// TrafficTarget is a revision's share of an app's requests (ADR 0022).
message TrafficTarget {
  string revision = 1;
  // Percent, 0 to 100.
  int32 weight = 2;
  // Serves the revision alone under <label>--<app>.
  string label = 3;
  // URLs of the label (status only).
  repeated string urls = 4;
  // Replicas the revision runs (status only).
  int32 replicas = 5;
}

message LogsRequest {
  string app = 1;
  bool follow = 2;
  // Lines per replica; 0 means the server default.
  int32 tail = 3;
  // Optional; restrict to one replica.
  string replica = 4;
  // For a job (ADR 0019): the run whose latest attempt to show; 0 means
  // the newest run.
  int64 run = 5;
  // An init container or a sidecar (ADR 0038); empty means the app's own
  // container.
  string container = 6;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

message LogEntry {
  string replica = 1;
  Stream stream = 2;
  bytes data = 3;
}

// AgentService is called by node agents. Callers must present a node client
// certificate (CN "node:<id>"). The agent always initiates the connection.
service AgentService {
  // Connect is the long-lived control stream: the server pushes assignments
  // and log requests, the agent pushes status.
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  // PushLogs carries the log stream for one LogRequest. The first message
  // must set request_id.
  rpc PushLogs(stream LogPush) returns (PushLogsResponse);
  // ExecSession serves one ExecRequest: the agent sends output, the server
  // sends input. The agent's first message must set request_id.
  rpc ExecSession(stream ExecSessionOutput) returns (stream ExecInput);
  // VolumeSession serves one VolumeRequest: archive data flows out of the
  // agent for a backup and into it for a restore. The agent's first
  // message must set request_id.
  rpc VolumeSession(stream VolumeData) returns (stream VolumeData);
  // RenewCertificate issues a new certificate for the calling node's
  // identity from a CSR for a new key.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  // GetCertificates returns the proxy certificates an assignment names by
  // reference (at most 256 per call).
  rpc GetCertificates(GetCertificatesRequest) returns (GetCertificatesResponse);
}

message GetCertificatesRequest {
  repeated string names = 1;
}

message GetCertificatesResponse {
  // The certificates the cluster serves among the names asked for; names it
  // does not serve are left out.
  repeated ProxyCertificate certificates = 1;
}

message RenewCertificateRequest {
  bytes csr = 1;
}

message RenewCertificateResponse {
  bytes cert = 1;
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    ReplicaReport report = 2;
    UsageReport usage = 3;
    Wake wake = 4;
  }
}

// Wake asks the leader to start an app scaled to zero: a request for it
// is waiting at the node's proxy (ADR 0021).
message Wake {
  string app = 1;
}

message Hello {
  int64 cpu_millis = 1;
  int64 memory_bytes = 2;
  string version = 3;
  string private_ip = 4;
  // GOOS and GOARCH of the agent, shown as the armada.os and armada.arch
  // labels.
  string os = 5;
  string arch = 6;
  reserved 7, 8;
  reserved "runtime", "min_memory_bytes";
  // The agent runs job replicas to completion (ADR 0019); runs are only
  // placed on nodes whose agent says so.
  bool jobs = 9;
  // The node mounts volumes (ADR 0023): its runtime can, and the agent has
  // a directory for them.
  bool volumes = 10;
  // The node's WireGuard public key, base64 (ADR 0025); empty when the node
  // is not part of a cluster network.
  string network_key = 11;
  // The agent takes certificates by reference in assignments and fetches
  // them with GetCertificates, so an assignment does not grow with every
  // certificate of the cluster.
  bool certificate_refs = 12;
  // The agent runs init containers and sidecars (ADR 0038); replicas that
  // have them are only placed on nodes whose agent says so.
  bool containers = 13;
  // The node reads job queues from network sandboxes in its subnet of the
  // cluster network (ADR 0040).
  bool queue_sandboxes = 14;
  // The node pulls the images of a held replica without starting it
  // (ReplicaSpec.hold), so a volume app's new replica is ready before the
  // old one stops (ADR 0023).
  bool held_replicas = 15;
  // The node backs volumes up to buckets (ADR 0041).
  bool volume_backups = 16;
  // The node mounts NFSv4 exports as volumes (ADR 0042).
  bool nfs = 17;
}

message ReplicaReport {
  repeated ReplicaState replicas = 1;
}

message ReplicaState {
  string id = 1;
  string state = 2;
  string container_id = 3;
  string address = 4;
  string message = 5;
  // Image reference pinned by digest after a successful pull.
  string image_digest = 6;
  // True when the replica passes its readiness checks and may get traffic.
  bool ready = 7;
  // Platforms of the replica's image as "os/arch", reported after a pull
  // or when the image has no variant for the node (ADR 0014).
  repeated string image_platforms = 8;
  // For job replicas (ADR 0019): the container has exited, with exit_code.
  bool finished = 9;
  int32 exit_code = 10;
  // The container's address in the node's subnet of the cluster network
  // (ADR 0025), whatever the app's ingress; empty elsewhere.
  string ip = 11;
}

// UsageReport carries what the node's replicas use, sampled periodically
// (ADR 0016). It is sent apart from ReplicaReport because it changes on
// every sample.
message UsageReport {
  repeated ReplicaUsage replicas = 1;
  // Requests in progress per replica at this node's proxy, for every
  // replica it routes to, not only its own (ADR 0020).
  repeated ReplicaLoad load = 2;
  // Whether the node's proxy was read; false for nodes without a proxy.
  bool load_measured = 3;
  // Disk use of the volumes on the node, measured about once a minute
  // (ADR 0023); unset in reports between measurements.
  repeated VolumeUsage volumes = 4;
  bool volumes_measured = 5;
  // Connections the node's kernel tracks, and the limit; the limit is 0
  // while nothing is tracked (ADR 0025).
  int64 conntrack_entries = 6;
  int64 conntrack_max = 7;
  // Queue lengths the node read in its replicas (ADR 0034).
  repeated QueueLength queues = 8;
  // The job queues the node reads from network sandboxes (ADR 0040), one
  // entry per sandbox, whether or not a length was read yet.
  repeated SandboxQueue sandboxes = 9;
}

// SandboxQueue is one job's network sandbox on the node and the length of
// the job's queue read from it.
message SandboxQueue {
  // The job's ID.
  string job = 1;
  // The sandbox's address in the node's subnet.
  string ip = 2;
  // A length was read; length and the fields after it are set only then.
  bool measured = 3;
  int64 length = 4;
  // How long ago the length was read, in milliseconds.
  int64 age_millis = 5;
  // Counts the sandbox's readings since the agent started: a new number is
  // a new reading.
  int64 reading = 6;
}

message QueueLength {
  // The replica the length was read from.
  string id = 1;
  int64 length = 2;
  // The rule's type: "queue", "redis", or "rabbitmq".
  string type = 3;
}

message VolumeUsage {
  string app = 1;
  string volume = 2;
  int64 bytes = 3;
}

message ReplicaLoad {
  string id = 1;
  int64 in_flight = 2;
  // Requests the proxy sent to the replica since the previous report
  // (ADR 0021).
  int64 requests = 3;
}

message ReplicaUsage {
  string id = 1;
  // CPU used since the previous sample, in millicores.
  int64 cpu_millis = 2;
  // Memory in use, without page cache the kernel can reclaim.
  int64 memory_bytes = 3;
  // Bytes the container sent since the previous sample.
  int64 egress_bytes = 4;
  // Processes the kernel killed at the memory limit since the previous sample.
  int64 oom_kills = 5;
}

message ServerMessage {
  oneof msg {
    Assignment assignment = 1;
    LogRequest log_request = 2;
    LogCancel log_cancel = 3;
    ExecRequest exec_request = 4;
    VolumeRequest volume_request = 5;
  }
}

// VolumeRequest asks the agent to open a VolumeSession for a volume it
// holds (ADR 0023).
message VolumeRequest {
  enum Op {
    OP_UNSPECIFIED = 0;
    // Send the volume as a gzipped tar.
    OP_BACKUP = 1;
    // Replace the volume's contents with a gzipped tar the server sends.
    OP_RESTORE = 2;
    // Delete the volume's directory.
    OP_REMOVE = 3;
    // Back the volume up to its bucket and apply keep (ADR 0041).
    OP_SNAPSHOT = 4;
    // List the backups in the bucket.
    OP_SNAPSHOTS = 5;
    // Replace the volume's contents with a backup from the bucket.
    OP_RESTORE_SNAPSHOT = 6;
  }
  string request_id = 1;
  Op op = 2;
  string app = 3;
  string volume = 4;
  // Stop the app's container on the node for the operation (always for
  // restores and removals).
  bool stop = 5;
  // The bucket, for the snapshot operations.
  BackupTarget backup = 6;
  // The backup to restore: an ID or "latest".
  string snapshot = 7;
}

// BackupTarget is a volume's bucket and key, decrypted from the app's
// secrets. Never log it.
message BackupTarget {
  string url = 1;
  bytes key = 2;
  BackupKeep keep = 3;
  // The zone keep counts days in; empty: UTC.
  string time_zone = 4;
}

message BackupKeep {
  int32 last = 1;
  int32 hourly = 2;
  int32 daily = 3;
  int32 weekly = 4;
  int32 monthly = 5;
}

// VolumeData carries one chunk of a volume archive, at most 64 KiB.
message VolumeData {
  // The agent's first message only.
  string request_id = 1;
  bytes data = 2;
  // The last message: the archive is complete, or the operation is done.
  bool done = 3;
  // The operation failed; the last message.
  string error = 4;
  // OP_SNAPSHOT: the backup taken and what the repository holds.
  CreateVolumeSnapshotResponse snapshot = 5;
  // OP_SNAPSHOTS: the backups, oldest first.
  repeated VolumeSnapshot snapshots = 6;
}

// Assignment is the complete desired set of replicas for the node. Replicas
// not listed must be removed.
message Assignment {
  repeated ReplicaSpec replicas = 1;
  // Ingress configuration, identical for every node.
  ProxyConfig proxy = 2;
  // API addresses of every control plane node; the agent fails over to the
  // next one when its server goes away.
  repeated string servers = 3;
  // The cluster network (ADR 0025); unset in clusters without one.
  NetworkConfig network = 4;
  // The job queues this node reads from network sandboxes (ADR 0040).
  // Sandboxes not listed must be removed.
  repeated QueueSandbox queue_sandboxes = 5;
}

// QueueSandbox asks the node to keep a network sandbox for a job, wired into
// the node's container network like the job's containers, and to read the
// job's queue from inside it.
message QueueSandbox {
  // The job's ID.
  string job = 1;
  // The queue: type "redis" or "rabbitmq", the URL from the job's pinned
  // secret (never logged), and the list or queue name.
  QueueProbe probe = 2;
  int64 interval_seconds = 3;
}

// NetworkConfig is how the cluster network routes node subnets between
// nodes (ADR 0025). Identical for every node.
message NetworkConfig {
  // "plain" (VXLAN on the private network) or "wireguard".
  string mode = 1;
  string cluster_cidr = 2;
  // Every node with a subnet, the receiving node included.
  repeated NetworkPeer peers = 3;
  // The container addresses of every replica in a node subnet, with their
  // app IDs: what each node's firewall keys on (ADR 0026).
  repeated NetworkEndpoint endpoints = 4;
  // The default space's containers are isolated like other spaces'.
  bool isolate_default = 5;
  // The ports of internal TCP apps, which containers of isolated spaces
  // may connect to on their bridge gateway (ADR 0039).
  repeated uint32 tcp_ports = 6;
}

message NetworkEndpoint {
  string address = 1;
  // App or job ID (spec.AppID).
  string app = 2;
}

message NetworkPeer {
  string node = 1;
  // The address the tunnel reaches the node at.
  string private_ip = 2;
  // The node's container subnet, a /24 of the cluster CIDR.
  string subnet = 3;
  // The node's WireGuard public key, base64; empty until it has announced
  // one.
  string public_key = 4;
}

message ProxyConfig {
  repeated ProxyBackend backends = 1;
  repeated ProxyRule rules = 2;
  repeated ProxyCertificate certificates = 3;
  // Private address of the control plane's ACME HTTP-01 responder.
  string acme_challenge_address = 4;
  // Prefixes whose requests keep their client address headers.
  repeated string trusted_proxies = 5;
  // Internal TCP listeners on the bridge gateway (ADR 0039).
  repeated ProxyTCPRoute tcp_routes = 6;
}

// ProxyTCPRoute sends connections to port on a node's bridge gateway from
// the backend's space to the backend (ADR 0039).
message ProxyTCPRoute {
  uint32 port = 1;
  string backend = 2;
  // The app IDs that may connect (the app itself included); empty lets
  // every app of the backend's space.
  repeated string allow = 3;
}

message ProxyBackend {
  // App name.
  string name = 1;
  repeated ProxyServer servers = 2;
  // HTTP health check path; empty means a TCP check.
  string health_path = 3;
  // The app scales to zero: with no replica to serve, requests wait at the
  // agent while it starts one (ADR 0021).
  bool wake = 4;
  // Each node's proxy prefers the app's replicas on its own node while
  // they are about as busy as its other replicas (ADR 0024). Off for
  // traffic splitting, which needs every server to keep its weight.
  bool local_first = 5;
  // How long a request may wait for the app's response, in seconds; 0 means
  // the default of a minute.
  uint32 timeout_seconds = 6;
  // Prefixes of the only clients that may reach the app from outside, or
  // of the clients that may not; at most one of the two is set (ADR 0035).
  repeated string ip_allow = 7;
  repeated string ip_deny = 8;
  // A cookie sends each client back to the server that answered it first
  // (ADR 0036).
  bool sticky = 9;
  // The app's CORS policy (ADR 0037); unset for none.
  ProxyCORS cors = 10;
}

message ProxyCORS {
  repeated string origins = 1;
  repeated string methods = 2;
  repeated string headers = 3;
  repeated string expose = 4;
  uint32 max_age_seconds = 5;
  bool credentials = 6;
}

message ProxyServer {
  // Replica ID.
  string name = 1;
  // ip:port on a node's private IP.
  string address = 2;
  // Share of the backend's requests, 1 to 256; 0 means 1 (ADR 0022).
  uint32 weight = 3;
}

message ProxyRule {
  string host = 1;
  string path_prefix = 2;
  bool strip_prefix = 3;
  string backend = 4;
  // Internal rules route <app>.internal on the node-local internal
  // frontend, which only containers on that node can reach.
  bool internal = 5;
  // For internal rules: the app IDs that may call (the app itself
  // included); empty lets every app of the backend's space (ADR 0026).
  repeated string allow = 6;
}

message ProxyCertificate {
  // Hostname the certificate is for (may start with "*.").
  string name = 1;
  // Certificate chain followed by the private key, PEM encoded. Empty in an
  // assignment to an agent that announced Hello.certificate_refs: the
  // agent fetches what it lacks with GetCertificates.
  bytes pem = 2;
  // SHA-256 of pem, set in assignments that leave pem out.
  bytes sha256 = 3;
}

message ReplicaSpec {
  string id = 1;
  string app = 2;
  string revision = 3;
  string image = 4;
  repeated string command = 5;
  repeated string args = 6;
  repeated EnvVar env = 7;
  int32 port = 8;
  int64 memory_bytes = 9;
  int64 nano_cpus = 10;
  int64 pids_limit = 11;
  Probe startup = 12;
  Probe readiness = 13;
  Probe liveness = 14;
  repeated SecretFile secret_files = 15;
  RegistryAuth registry = 16;
  // CPU reserved for the replica on its node, in millicores; the agent
  // gives the container a CPU weight in proportion. Not part of the spec
  // hash: a revision's reservation never changes.
  int64 cpu_reserve_millis = 17;
  // Set for a replica that runs one attempt of a job run (ADR 0019).
  JobAttempt job = 18;
  // Persistent volumes on this node (ADR 0023).
  repeated VolumeSpec volumes = 19;
  // The app's queue rules (ADR 0034): the agent reads each queue's length
  // from one replica of the app on the node. Not part of the spec hash.
  repeated QueueProbe queues = 20;
  // Init containers run in order, each to completion, before the sidecars
  // and the replica's own container start; sidecars run alongside it
  // (ADR 0038). All share the replica's network namespace.
  repeated ContainerSpec init_containers = 21;
  repeated ContainerSpec sidecars = 22;
  // The replica is held: the agent pulls its images and reports "pulling",
  // then "pulled", but starts no container until the hold is lifted. Only
  // sent to agents that announce Hello.held_replicas.
  bool hold = 23;
  // Stop the replica's containers once the agent has been cut off from the
  // control plane this long (0: never): its volumes may then be restored
  // on another node (ADR 0041). Not part of the spec hash.
  int64 fence_after_seconds = 24;
}

// An init container or a sidecar of a replica (ADR 0038).
message ContainerSpec {
  string name = 1;
  // Pulled as it is, with the replica's registry credentials when the
  // registry is the same.
  string image = 2;
  repeated string command = 3;
  repeated string args = 4;
  repeated EnvVar env = 5;
  int64 memory_bytes = 6;
  int64 nano_cpus = 7;
  int64 cpu_reserve_millis = 8;
  int64 pids_limit = 9;
  // Names of the replica's volumes the container mounts, at their paths.
  repeated string volumes = 10;
  // Paths of the replica's secret files the container mounts.
  repeated string secret_files = 11;
}

// One queue rule: a command run in the replica ("queue"), or a broker
// dialled from the replica's network namespace ("redis", "rabbitmq").
message QueueProbe {
  repeated string command = 1;
  string type = 2;
  // The broker's URL, from the app's secret; never logged.
  string url = 3;
  // The pinned secret version the URL came from.
  string url_ref = 4;
  // The Redis list or the RabbitMQ queue.
  string name = 5;
}

message VolumeSpec {
  string name = 1;
  // Where it appears in the container.
  string path = 2;
  // "uid:gid" of the directory, applied whenever a replica starts; empty:
  // left as it is (root when created).
  string owner = 3;
  // An NFS export instead of a directory on the node (ADR 0042).
  NfsSource nfs = 4;
}

message NfsSource {
  // A private IP address.
  string server = 1;
  string path = 2;
  bool read_only = 3;
}

// JobAttempt marks a replica the agent runs to completion: it never
// restarts the container and reports its exit code.
message JobAttempt {
  string job = 1;
  int64 run = 2;
  // The attempt is over (finished, timed out, or cancelled): the agent
  // stops the container if it still runs, never starts it again, and keeps
  // it for its logs. Not part of the spec hash.
  bool done = 3;
}

// SecretFile is a secret the agent writes to tmpfs on the node and
// bind-mounts read-only into the container.
message SecretFile {
  string path = 1;
  bytes data = 2 [debug_redact = true];
  // Identifies the pinned secret version ("name@vN") so the agent can
  // fingerprint the spec without hashing plaintext.
  string ref = 3;
}

message RegistryAuth {
  string server = 1;
  string username = 2;
  string password = 3 [debug_redact = true];
  string ref = 4;
}

// Probe is an HTTP GET health check run by the agent against the container.
message Probe {
  string path = 1;
  int32 port = 2;
  int64 initial_delay_ms = 3;
  int64 period_ms = 4;
  int64 timeout_ms = 5;
  int32 failure_threshold = 6;
  // Runs in the container instead of an HTTP check; exit code 0 passes.
  repeated string command = 7;
}

message EnvVar {
  string name = 1;
  string value = 2 [debug_redact = true];
  // Set for values from a secret: the pinned version ("name@vN").
  string ref = 3;
}

message LogRequest {
  string request_id = 1;
  string replica_id = 2;
  bool follow = 3;
  int32 tail = 4;
  // An init container or a sidecar of the replica (ADR 0038); empty means
  // the replica's own container.
  string container = 5;
}

message LogCancel {
  string request_id = 1;
}

message LogPush {
  string request_id = 1;
  Stream stream = 2;
  bytes data = 3;
  // Set on the last message if the agent failed to read logs.
  string error = 4;
}

message PushLogsResponse {}

// Exec (ADR 0015).

message TermSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecStart {
  string app = 1;
  // Optional; empty picks a running, ready replica of the serving revision.
  string replica = 2;
  repeated string cmd = 3;
  // tty allocates a terminal; output then arrives as stdout only.
  bool tty = 4;
  // stdin: the command reads the stdin inputs that follow.
  bool stdin = 5;
  TermSize size = 6;
  // A sidecar of the replica (ADR 0038); empty means the app's own
  // container.
  string container = 7;
}

message ExecInput {
  oneof input {
    bytes stdin = 1;
    // close_stdin ends the command's standard input.
    bool close_stdin = 2;
    TermSize resize = 3;
  }
}

message ExecClientMessage {
  oneof msg {
    ExecStart start = 1;
    ExecInput input = 2;
  }
}

message ExecServerMessage {
  oneof msg {
    // The replica the command runs in; the first message.
    string replica = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    // The last message.
    int32 exit_code = 4;
  }
}

message ExecRequest {
  string request_id = 1;
  string replica_id = 2;
  repeated string cmd = 3;
  bool tty = 4;
  bool stdin = 5;
  TermSize size = 6;
  // A sidecar of the replica; empty means its own container.
  string container = 7;
}

message ExecSessionOutput {
  // Set on the first message.
  string request_id = 1;
  oneof output {
    bytes stdout = 2;
    bytes stderr = 3;
    // The last message when the command ran.
    int32 exit_code = 4;
    // The last message when it could not run.
    string error = 5;
  }
}

message ListVolumesRequest {
  // Empty: every app's.
  string app = 1;
}

message ListVolumesResponse {
  repeated Volume volumes = 1;
}

// Volume is a persistent volume bound to a node (ADR 0023).
message Volume {
  string app = 1;
  string name = 2;
  string node = 3;
  google.protobuf.Timestamp created_at = 4;
  // The app's current spec uses it.
  bool in_use = 5;
  // Disk use from the node's latest measurement; -1: unknown.
  int64 used_bytes = 6;
  // Where it appears in the container, while in use.
  string path = 7;
  // Scheduled backups (ADR 0041): set while the app's spec has them.
  bool backup = 8;
  google.protobuf.Timestamp last_backup_at = 9;
  // The last backup that failed, and why; cleared by a success.
  google.protobuf.Timestamp backup_failed_at = 10;
  string backup_error = 11;
  // What the volume's repository holds, as of the last backup.
  int64 backup_stored_bytes = 12;
  int32 backup_snapshots = 13;
  google.protobuf.Timestamp next_backup_at = 14;
}

message VolumeSnapshot {
  string id = 1;
  google.protobuf.Timestamp time = 2;
  // Known for a backup just taken.
  int64 files = 3;
  int64 bytes = 4;
}

message ListVolumeSnapshotsRequest {
  string app = 1;
  string name = 2;
}

message ListVolumeSnapshotsResponse {
  // Oldest first.
  repeated VolumeSnapshot snapshots = 1;
}

message CreateVolumeSnapshotRequest {
  string app = 1;
  string name = 2;
}

message CreateVolumeSnapshotResponse {
  VolumeSnapshot snapshot = 1;
  // Content no earlier backup had, and what the repository holds now.
  int64 new_bytes = 2;
  int64 stored_bytes = 3;
  int32 snapshots = 4;
}

message RestoreVolumeSnapshotRequest {
  string app = 1;
  string name = 2;
  // A backup's ID, or "latest".
  string snapshot = 3;
  // Restore onto this node instead of the volume's own, as RestoreVolumeStart.
  string node = 4;
}

message RemoveVolumeRequest {
  string app = 1;
  string name = 2;
}

message RemoveVolumeResponse {}

message BackupVolumeRequest {
  string app = 1;
  string name = 2;
  // Stop the app's replica during the backup, for a consistent copy.
  bool stop = 3;
}

message RestoreVolumeMessage {
  oneof msg {
    // The first message.
    RestoreVolumeStart start = 1;
    // Then the gzipped tar, in chunks of at most 64 KiB; an empty stream
    // end completes it.
    bytes data = 2;
  }
}

message RestoreVolumeStart {
  string app = 1;
  string name = 2;
  // Restore onto this node instead of the volume's own, e.g. when its node
  // is lost; the volume is bound to it afterwards.
  string node = 3;
}

message RestoreVolumeResponse {
  string node = 1;
}
