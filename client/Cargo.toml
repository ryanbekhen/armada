[package]
name = "armada-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The armada client: commands that talk to the control plane's API"

# The client is its own program (ADR 0027): it never links what a machine
# runs (armada-server, armada-store, armada-node, etcd); tests/dependencies.rs
# checks this list.
[dependencies]
armada-fsutil = { path = "../fsutil" }
armada-pki = { path = "../pki" }
armada-proto = { path = "../proto" }
armada-spec = { path = "../spec" }
hyper-util.workspace = true
libc.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["channel"] }
tower.workspace = true

[lib]
name = "armada_client"
path = "src/lib.rs"

[[bin]]
name = "armada"
path = "src/main.rs"

[features]
# ARMADA_CLIENT_TEST_NOW moves the client's clock (lib.rs clock_offset) for
# the recorded parity cases (tests/parity.rs): never in a release.
test-hooks = []

# The recorded parity cases, replayed
# against this armada and a stand-in AdminService (tonic's server, mTLS).
[dev-dependencies]
flate2.workspace = true
prost.workspace = true
tonic = { workspace = true, features = ["server"] }
x509-parser.workspace = true

[[test]]
name = "parity"
harness = false
required-features = ["test-hooks"]
