[package]
name = "armada-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "armadad: the commands that set up and run a machine (ADR 0055)"

# armadad is its own program (ADR 0027, ADR 0055): it links the client's
# command framework and version, never the other way round.
[dependencies]
# The node's agent (armadad agent) and the tunnels of a mesh node.
armada-agent = { path = "../agent" }
armada-client = { path = "../client" }
armada-fsutil = { path = "../fsutil" }
# armadad kv: a server's armada-kv member (ADR 0057), and init's in process.
armada-kv = { path = "../kv" }
# The control plane's backups in their bucket (ADR 0051) through the
# repository volume backups use, and the readers of a restore's archive.
armada-node = { path = "../node" }
armada-pki = { path = "../pki" }
armada-proto = { path = "../proto" }
armada-secrets = { path = "../secrets" }
# The control plane (armadad server) and the JoinService of joins.
armada-server = { path = "../server" }
armada-spec = { path = "../spec" }
# The cluster's state for backup, restore, and user renew.
armada-store = { path = "../store" }
flate2.workspace = true
# The join listener's connections (joinclient.rs).
hyper-util.workspace = true
libc.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tonic.workspace = true
tokio-rustls.workspace = true
tower.workspace = true

[features]
# The runtime pack compiled in: the pack
# `make runtime-bundle` writes for the target, or ARMADA_RUNTIME_PACK.
bundle = []
# The ARMADA_DAEMON_TEST_* hooks of the daemon's replays (src/hooks.rs):
# only in `make daemon-replay`, never in release builds.
test-hooks = ["armada-node/test-hooks"]

[lib]
name = "armada_daemon"
path = "src/lib.rs"

[[bin]]
name = "armadad"
path = "src/main.rs"

# The recorded parity cases, replayed against armadad (tests/parity): its
# own harness, since the cases run one
# after another against stand-ins and the pinned etcd.
[[test]]
name = "parity"
harness = false
required-features = ["test-hooks"]

# The recorded logger cases, replayed against
# armadad runtime-log (and armada-log with ARMADA_LOG_BIN).
[[test]]
name = "logwriter"
required-features = ["test-hooks"]
