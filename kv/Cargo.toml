[package]
name = "armada-kv"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Armada's own state store (ADR 0057): the subset of etcd's v3 API armada-store uses, on a multi-version key space in redb"

[dependencies]
armada-proto = { path = "../proto" }
# The state machine's commands are protobuf messages (the log's entries).
prost.workspace = true
# The key space, the leases, and the member's identity: one database file,
# every commit durable before it is answered.
redb.workspace = true
# Raft between the members (ADR 0057): elections, the replicated log,
# membership, snapshots, ReadIndex.
openraft.workspace = true
futures-util.workspace = true
# Lease and member IDs.
ring.workspace = true
# The snapshot's checksum.
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
# etcd's services and the peer service (armada-proto's servers, and
# armadakv.Peer's hand-written messages) over tonic's server and channel,
# with no router: each dispatches by path.
tonic = { workspace = true, features = ["server", "channel"] }
tonic-prost.workspace = true
hyper-util.workspace = true
tower.workspace = true
# The listeners and the peer connector (ADR 0057): TLS 1.3 on rustls with
# ring, the member certificate read on every handshake, the cluster CA's
# `etcd:member` identity required (read with armada-pki).
armada-pki = { path = "../pki" }
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true


