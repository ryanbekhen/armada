[package]
name = "armada-node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Armada's node agent in Rust, moving there in steps (ADR 0054)"
publish = false

# Crates under the licenses of ADR 0054 only, checked from Cargo.lock in CI
# (cargo deny, deny.toml) and listed in THIRD_PARTY_NOTICES.md.
[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
ruzstd = { version = "0.8", default-features = false, features = ["std", "hash"] }
# TLS for registries with the ring provider (its C and assembly are built
# with clang for both targets, see .cargo/config.toml).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
