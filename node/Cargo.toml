[package]
name = "armada-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "armada-node: the node's work the agent hands it (ADR 0054)"

# Versions and features live in the workspace (../Cargo.toml).
[dependencies]
flate2.workspace = true
libc.workspace = true
# Keys, HMAC, AES-GCM, and digests of volume backups (src/volbackup); the
# same crate rustls uses.
ring.workspace = true
ruzstd.workspace = true
# TLS for registries with the ring provider (its C and assembly are built
# with clang for both targets, see ../.cargo/config.toml).
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
x25519-dalek.workspace = true

[features]
# The ARMADA_NODE_TEST_* hooks of the tests (src/hooks.rs): only in
# `make node-test-hooks`, never in release builds.
test-hooks = []
