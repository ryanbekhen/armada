[package]
name = "armada-node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Armada's node agent in Rust, moving there in steps (ADR 0054)"
publish = false

# Crates under the licenses of ADR 0054 only, checked from Cargo.lock in CI
# (cargo deny, deny.toml) and listed in THIRD_PARTY_NOTICES.md.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
