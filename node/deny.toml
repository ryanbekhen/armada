# Crates armada-node may use (ADR 0054): the licenses Armada allows for Go
# modules, plus Unicode-3.0 for Unicode data. `cargo deny check licenses`
# runs in CI; a crate under any other license fails it.
[graph]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# The list is the policy, whether or not a crate uses each license yet.
unused-allowed-license = "allow"
