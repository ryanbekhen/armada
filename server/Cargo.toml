[package]
name = "armada-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The control plane, a port of Go's internal/server and the server side of `armadad server` (ADR 0055)"

[dependencies]
armada-fsutil = { path = "../fsutil" }
# ParseTarget of volume backup URLs, shared with the node (its library).
armada-node = { path = "../node" }
armada-pki = { path = "../pki" }
armada-proto = { path = "../proto" }
armada-secrets = { path = "../secrets" }
armada-spec = { path = "../spec" }
armada-store = { path = "../store" }
# Certificate requests and the leaf certificates ACME issues (acme/).
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
# The API and the join listener: tonic's server (hyper and h2) over TLS
# connections accepted here, with no router: one service dispatches by
# path.
tonic = { workspace = true, features = ["server"] }
tower.workspace = true
x509-parser.workspace = true

[features]
# The program Go's scenario parity tests drive
# (src/bin/armada-server-parity.rs, ARMADA_SERVER_BIN): never part of a
# release. A control plane backup's bucket is reached at the address the
# test names (armada-node's test hooks).
parity = ["armada-node/test-hooks", "armada-store/parity"]

# The scenarios recorded from Go's server replayed against the Rust one
# (tests/scenarios.rs, ADR 0055 item 20): gRPC calls by method path, the
# fake agents' sessions, and the store's methods by name.
[dev-dependencies]
hyper-util.workspace = true
prost.workspace = true
tonic = { workspace = true, features = ["channel"] }

[[test]]
name = "scenarios"
required-features = ["parity"]

[[bin]]
name = "armada-server-parity"
required-features = ["parity"]

[[bin]]
name = "armada-acme-parity"
required-features = ["parity"]
