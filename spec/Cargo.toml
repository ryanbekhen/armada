[package]
name = "armada-spec"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Armada's app and job specs: strict YAML, defaults, validation, export, and variables"

[dependencies]
# Time zones of schedules and backups: the machine's zoneinfo files first
# ($ZONEINFO, then the system's directories), then jiff's bundled database.
jiff.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The recorded cases, gzipped (tests/parity.rs).
flate2.workspace = true

# The recorded cases (tests/parity.rs) drive the crate through this
# program; it is never packed.
[[bin]]
name = "armada-spec-check"
path = "src/bin/armada-spec-check.rs"
