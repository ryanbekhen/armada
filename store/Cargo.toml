[package]
name = "armada-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The cluster state in etcd, a port of Go's internal/store and the client side of internal/etcd (ADR 0055)"

[dependencies]
armada-pki = { path = "../pki" }
armada-proto = { path = "../proto" }
armada-secrets = { path = "../secrets" }
armada-spec = { path = "../spec" }
# etcd's gRPC API: tonic's channel over a TLS 1.3 connection made here
# (rustls with ring, the member certificate read on every handshake).
hyper-util.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["channel"] }
tower.workspace = true

[features]
# The program Go's parity tests drive (src/bin/armada-store-parity.rs,
# ARMADA_STORE_BIN): never part of a release.
parity = []

[[bin]]
name = "armada-store-parity"
required-features = ["parity"]

# Go's parity tests replayed from recordings against armada-store-parity
# on the pinned etcd (make store-replay).
[[test]]
name = "replay"
required-features = ["parity"]
